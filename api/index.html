<!doctype html>
<!--
  Page for GitHub Pages.
  The workflow .github/workflows/openapi.yml puts openapi.json next to this file,
  and publishes both at /api on the gh-pages branch.
-->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>YACO node API</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swagger-ui-dist@5.33.0/swagger-ui.css">
</head>
<body>
  <div id="swagger-ui"></div>
  <script src="https://cdn.jsdelivr.net/npm/swagger-ui-dist@5.33.0/swagger-ui-bundle.js"></script>
  <script>
    SwaggerUIBundle({
      url: "openapi.json",
      dom_id: "#swagger-ui",
      // No server serves the API here, so "Try it out" is off.
      supportedSubmitMethods: [],
    });
  </script>
</body>
</html>
