# Example config of the YACO agent.
# Every value except node.id and node.public_ip has the default shown here.
# The join token is not in this file. Set it in the YACO_TOKEN environment variable.

[node]
# Unique ID of this node in the cluster.
id = "node-1"
# Public IP of this node, for both WireGuard endpoints.
public_ip = "203.0.113.1"
# Public bootstrap addresses (IP and boot_port) of existing nodes.
# Empty: this node starts a new cluster.
seeds = []
# UDP port of the mesh WireGuard interface. Open it on the public interface.
mesh_port = 7281
# UDP port of the bootstrap WireGuard interface. Open it on the public interface.
boot_port = 7282
# Interface names, at most 15 characters.
mesh_interface = "yaco-mesh"
boot_interface = "yaco-boot"

# Every node of a cluster must have the same values in this table.
# A joining node sends a fingerprint of them, and a seed with other values refuses the join.
[cluster]
# Subnet of the mesh IPs.
mesh_subnet = "10.42.0.0/16"
# MTU of both WireGuard interfaces.
mtu = 1420
# How often the peer list is synchronized without a membership change.
peer_resync_interval = "30s"
# How long a peer from a join stays configured without appearing in gossip.
pending_peer_ttl = "1m"

# chitchat ignores messages with another cluster ID.
cluster_id = "yaco"
# UDP port of chitchat, on the mesh IP only.
gossip_port = 7280
gossip_interval = "1s"
# Gossip rounds to wait after a node marks itself as leaving.
leave_rounds = 3
# How long a dead node (and its WireGuard peer) is kept.
dead_node_grace_period = "1day"
# How long chitchat keeps deleted keys.
tombstone_grace_period = "1h"
# Failure detector. These are the chitchat defaults.
phi_threshold = 8.0
sampling_window_size = 1000
max_heartbeat_interval = "10s"
initial_heartbeat_interval = "5s"

# TCP port of the join endpoint, inside the bootstrap tunnel.
join_port = 7283
join_request_timeout = "5s"
# How often a joining node tries all seeds before it gives up.
join_rounds = 5
# Pause between two join rounds. A random part of up to the same length is added.
join_retry_delay = "5s"
# How many mesh IPs a joining node proposes to one seed before it gives up.
max_mesh_ip_attempts = 16
