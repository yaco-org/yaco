c_peers` configures them one by one.\n//! Only a node that disappears from gossip removes a peer,\n//! so a peer from the channel stays until gossip has it.\n//!\n//! A dead node keeps its peer so that if it came back\n//! (after network connection is restored, for example),\n//! it would be able to continue communication with the rest of the cluster.\n//! chitchat gossips with dead nodes from time to time, for this reason.\n//!\n//! A peer is removed only when its node leaves gracefully,\n//! or when chitchat forgets the dead node (`dead_node_grace_period`).\n\nmod tests;\n\nuse std::fmt;\nuse std::net::{IpAddr, Ipv4Addr, SocketAddr};\nuse std::str::FromStr;\nuse std::time::Duration;\n\nuse anyhow::Context;\nuse defguard_wireguard_rs::key::Key;\nuse defguard_wireguard_rs::net::IpAddrMask;\nuse defguard_wireguard_rs::peer::Peer;\nuse defguard_wireguard_rs::{InterfaceConfiguration, Kernel, WGApi, WireguardInterfaceApi};\nuse ipnet::Ipv4Net;\nuse serde::{Deserialize, Serialize};\nuse sha2::{Digest, Sha256};\nuse tokio::sync::{mpsc, watch};\n\nuse yaco_api::{Liveness, Node};\n\nuse crate::config::Config;\nuse crate::view::{ClusterView, FACTS_PREFIX};\n\n/// Names of the facts that the mesh needs.\n/// In chitchat, the keys have the prefix `view::FACTS_PREFIX`.\npub const WG_PUBLIC_KEY_FACT: \u0026str = \"wg_public_key\";\npub const MESH_IP_FACT: \u0026str = \"mesh_ip\";\npub const ENDPOINT_FACT: \u0026str = \"endpoint\";\n\n/// One node of the mesh, as the WireGuard peer list needs it.\n#[derive(Clone, Debug, PartialEq, Eq, Serialize, Deserialize)]\npub struct MeshPeer {\n    /// The chitchat node ID.\n    pub node_id: String,\n    /// Base64 in JSON and in the facts, as `wg` prints it.\n    pub public_key: Key,\n    pub mesh_ip: Ipv4Addr,\n    pub endpoint: SocketAddr,\n}\n\nimpl MeshPeer {\n    /// The facts of this node, with the mesh IP of `attempt` (see `MeshSubnet::mesh_ip`).\n    pub fn own(config: \u0026Config, public_key: \u0026Key, attempt: u32) -\u003e Self {\n        Self {\n            node_id: config.node.id.clone(),\n            public_key: public_key.clone(),\n            mesh_ip: config.cluster.mesh_subnet.mesh_ip(\u0026config.node.id, attempt),\n            endpoint: SocketAddr::new(config.node.public_ip, config.node.mesh_port),\n        }\n    }\n\n    /// Parses the facts of one node of the cluster view.\n    /// Received data can be malformed, so this never panics.\n    pub fn from_node(node: \u0026Node) -\u003e anyhow::Result\u003cSelf\u003e {\n        let fact = |name: \u0026str| {\n            node.facts\n                .get(name)\n                .with_context(|| format!(\"missing {name}\"))\n        };\n        let public_key = fact(WG_PUBLIC_KEY_FACT)?;\n        let public_key = Key::try_from(public_key.as_str())\n            .map_err(|err| anyhow::anyhow!(\"bad {WG_PUBLIC_KEY_FACT}: {err}\"))?;\n        let mesh_ip = fact(MESH_IP_FACT)?\n            .parse()\n            .with_context(|| format!(\"bad {MESH_IP_FACT}\"))?;\n        let endpoint = fact(ENDPOINT_FACT)?\n            .parse()\n            .with_context(|| format!(\"bad {ENDPOINT_FACT}\"))?;\n        Ok(Self {\n            node_id: node.id.clone(),\n            public_key,\n            mesh_ip,\n            endpoint,\n        })\n    }\n\n    /// Returns the facts to publish for this node.\n    /// The node ID is not a fact: chitchat has it in the node's `ChitchatId`.\n    pub fn to_facts(\u0026self) -\u003e Vec\u003c(String, String)\u003e {\n        [\n            (WG_PUBLIC_KEY_FACT, self.public_key.to_string()),\n            (MESH_IP_FACT, self.mesh_ip.to_string()),\n            (ENDPOINT_FACT, self.endpoint.to_string()),\n        ]\n        .into_iter()\n        .map(|(name, value)| (format!(\"{FACTS_PREFIX}{name}\"), value))\n        .collect()\n    }\n}\n\n/// Subnet of the mesh IPs.\n///\n/// It is a /30 or larger and has no host bits set,\n/// so it always has room for two or more hosts, as `mesh_ip` needs.\n/// In the config file and in JSON it is a string like \"10.42.0.0/16\".\n#[derive(Clone, Copy, Debug, PartialEq, Eq, Serialize, Deserialize)]\n#[serde(try_from = \"Ipv4Net\", into = \"Ipv4Net\")]\npub struct MeshSubnet(Ipv4Net);\n\nimpl TryFrom\u003cIpv4Net\u003e for MeshSubnet {\n    type Error = anyhow::Error;\n\n    fn try_from(net: Ipv4Net) -\u003e anyhow::Result\u003cSelf\u003e {\n        // A /31 or /32 has no room for host addresses.\n        anyhow::ensure!(\n            net.prefix_len() \u003c= 30,\n            \"mesh subnet {net} is too small, the longest prefix is /30\"\n        );\n        anyhow::ensure!(\n            net == net.trunc(),\n            \"mesh subnet {net} has host bits set, write {}\",\n            net.trunc()\n        );\n        Ok(Self(net))\n    }\n}\n\nimpl From\u003cMeshSubnet\u003e for Ipv4Net {\n    fn from(subnet: MeshSubnet) -\u003e Self {\n        subnet.0\n    }\n}\n\nimpl FromStr for MeshSubnet {\n    type Err = anyhow::Error;\n\n    fn from_str(text: \u0026str) -\u003e anyhow::Result\u003cSelf\u003e {\n        let net: Ipv4Net = text.parse()?;\n        Self::try_from(net)\n    }\n}\n\nimpl fmt::Display for MeshSubnet {\n    fn fmt(\u0026self, f: \u0026mut fmt::Formatter) -\u003e fmt::Result {\n        self.0.fmt(f)\n    }\n}\n\nimpl MeshSubnet {\n    pub fn prefix_len(\u0026self) -\u003e u8 {\n        self.0.prefix_len()\n    }\n\n    /// Returns true if `ip` is a host address in the subnet:\n    /// in the subnet, and neither the subnet address nor the broadcast address.\n    pub fn is_host(\u0026self, ip: Ipv4Addr) -\u003e bool {\n        self.0.contains(\u0026ip) \u0026\u0026 ip != self.0.network() \u0026\u0026 ip != self.0.broadcast()\n    }\n\n    /// Proposes a mesh IP for a node.\n    ///\n    /// SHA-256 keeps the result stable across versions and platforms.\n    pub fn mesh_ip(\u0026self, node_id: \u0026str, attempt: u32) -\u003e Ipv4Addr {\n        let mut hasher = Sha256::new();\n        hasher.update(node_id.as_bytes());\n        hasher.update(attempt.to_be_bytes());\n        let hash = hasher.finalize();\n        let value = u32::from_be_bytes([hash[0], hash[1], hash[2], hash[3]]);\n        // All addresses of the subnet, minus the subnet address and the broadcast address.\n        let host_count = (1u64 \u003c\u003c (32 - self.0.prefix_len())) - 2;\n        let host = 1 + u64::from(value) % host_count;\n        Ipv4Addr::from(u32::from(self.0.network()) + host as u32)\n    }\n}\n\n/// Returns the peers of all other nodes of the view, live or dead.\n/// Skips the nodes that left gracefully,\n/// and skips (with a warning) nodes with bad or missing facts.\nfn good_known_peers(view: \u0026ClusterView) -\u003e Vec\u003cMeshPeer\u003e {\n    let mut peers = Vec::new();\n    for node in view.nodes.values() {\n        if node.id == view.self_id || node.liveness == Liveness::Leaving {\n            continue;\n        }\n        match MeshPeer::from_node(node) {\n            Ok(peer) =\u003e peers.push(peer),\n            Err(err) =\u003e tracing::warn!(node_id = %node.id, \"skipping node with bad facts: {err:#}\"),\n        }\n    }\n    peers\n}\n\n/// Adds a peer to the queue of peers to configure.\n/// Replaces an older queued peer of the same node.\nfn add_pending(pending: \u0026mut Vec\u003cMeshPeer\u003e, peer: MeshPeer) {\n    pending.retain(|p| p.node_id != peer.node_id);\n    pending.push(peer);\n}\n\n#[derive(Debug, Default, PartialEq, Eq)]\nstruct PeersDiff {\n    changed: Vec\u003cMeshPeer\u003e,\n    gone: Vec\u003cMeshPeer\u003e,\n}\n\n/// Compares two gossip views.\n/// Returns the peers that are new or changed in `new`,\n/// and the peers of `old` whose node is not in `new`:\n/// the node left gracefully, or chitchat forgot it.\nfn get_gossip_changes(old: \u0026[MeshPeer], new: \u0026[MeshPeer]) -\u003e PeersDiff {\n    let changed = new\n        .iter()\n        .filter(|peer| !old.contains(peer))\n        .cloned()\n        .collect();\n    let gone = old\n        .iter()\n        .filter(|peer| !new.iter().any(|p| p.node_id == peer.node_id))\n        .cloned()\n        .collect();\n    PeersDiff { changed, gone }\n}\n\n/// The mesh interface of this node.\npub struct Mesh {\n    api: WGApi\u003cKernel\u003e,\n    interface: String,\n    psk: Key,\n    peers: Vec\u003cMeshPeer\u003e,\n}\n\nimpl Mesh {\n    /// Creates and configures the mesh interface, with no peers.\n    /// `psk` is the pre-shared key for all peers, from the join token.\n    pub fn create(\n        config: \u0026Config,\n        private_key: \u0026Key,\n        psk: \u0026Key,\n        mesh_ip: Ipv4Addr,\n    ) -\u003e anyhow::Result\u003cMesh\u003e {\n        let interface = config.node.mesh_interface.clone();\n        let mut api = WGApi::\u003cKernel\u003e::new(interface.clone())?;\n\n        // An interface left behind by a crashed agent is not a problem:\n        // `create_interface` reuses an existing interface,\n        // and `configure_interface` replaces its addresses, key and peers.\n        api.create_interface()\n            .with_context(|| format!(\"cannot create interface {interface}\"))?;\n        api.configure_interface(\u0026InterfaceConfiguration {\n            name: interface.clone(),\n            prvkey: private_key.to_string(),\n            // The subnet prefix makes the kernel route the whole subnet into the interface.\n            addresses: vec![IpAddrMask::new(\n                IpAddr::V4(mesh_ip),\n                config.cluster.mesh_subnet.prefix_len(),\n            )],\n            port: config.node.mesh_port,\n            peers: Vec::new(),\n            mtu: Some(config.cluster.mtu),\n            fwmark: None,\n        })\n        .with_context(|| format!(\"cannot configure interface {interface}\"))?;\n\n        Ok(Mesh {\n            api,\n            interface,\n            psk: psk.clone(),\n            peers: Vec::new(),\n        })\n    }\n\n    /// The configured peers.\n    pub fn peers(\u0026self) -\u003e \u0026[MeshPeer] {\n        \u0026self.peers\n    }\n\n    /// Configures `peer`.\n    /// Removes the old peer of the same node if its key is different,\n    /// for example after a restart.\n    pub fn add_peer(\u0026mut self, peer: \u0026MeshPeer) -\u003e anyhow::Result\u003c()\u003e {\n        if self.peers.contains(peer) {\n            return Ok(());\n        }\n        self.configure_peer(peer)?;\n        tracing::info!(node_id = %peer.node_id, mesh_ip = %peer.mesh_ip, endpoint = %peer.endpoint, \"configured mesh peer\");\n\n        let old = self\n            .peers\n            .iter()\n            .find(|p| p.node_id == peer.node_id \u0026\u0026 p.public_key != peer.public_key)\n            .cloned();\n        if let Some(old) = old {\n            self.remove_peer(\u0026old);\n        }\n        self.peers.retain(|p| p.node_id != peer.node_id);\n        self.peers.push(peer.clone());\n        Ok(())\n    }\n\n    fn configure_peer(\u0026self, peer: \u0026MeshPeer) -\u003e anyhow::Result\u003c()\u003e {\n        let mut wg_peer = Peer::new(peer.public_key.clone());\n        wg_peer.preshared_key = Some(self.psk.clone());\n        wg_peer.endpoint = Some(peer.endpoint);\n        wg_peer.allowed_ips = vec![IpAddrMask::host(IpAddr::V4(peer.mesh_ip))];\n        self.api.configure_peer(\u0026wg_peer)?;\n        Ok(())\n    }\n\n    /// Removes `peer` if it is configured with the same key.\n    /// A failure is only logged.\n    pub fn remove_peer(\u0026mut self, peer: \u0026MeshPeer) {\n        if !self.peers.iter().any(|p| p.public_key == peer.public_key) {\n            return;\n        }\n        match self.api.remove_peer(\u0026peer.public_key) {\n            Ok(()) =\u003e {\n                tracing::info!(node_id = %peer.node_id, public_key = %peer.public_key, \"removed mesh peer\")\n            }\n            Err(err) =\u003e {\n                tracing::error!(node_id = %peer.node_id, \"cannot remove mesh peer: {err:#}\")\n            }\n        }\n        self.peers.retain(|p| p.public_key != peer.public_key);\n    }\n\n    /// Removes the mesh interface.\n    ///\n    /// Only logs a failure: the agent stops anyway,\n    /// and the next start reuses a leftover interface.\n    /// Known failure: `remove_interface` also clears DNS settings of the interface,\n    /// and fails on hosts with neither systemd-resolved nor resolvconf.\n    /// Then the kernel interface stays.\n    pub fn remove(self) {\n        match self.api.remove_interface() {\n            Ok(()) =\u003e tracing::info!(\"removed interface {}\", self.interface),\n            Err(err) =\u003e tracing::warn!(\"cannot remove interface {}: {err}\", self.interface),\n        }\n    }\n}\n\n/// Configures the peers from the cluster view and from the channel `new_peers`,\n/// and removes the peers of nodes that disappear from the view.\n///\n/// `new_peers` brings the peers that are not in gossip yet:\n/// from `main` after a join, and from the join server for every accepted node.\n/// After every update, `peers` gets all peers of this node, queued ones included,\n/// for the mesh IP check and the response of the join server.\n///\n/// Updates on every change of the view, on every new peer from the channel,\n/// and also every `resync_interval`, to retry failed peers.\n/// Returns when the view task stops.\npub async fn sync_peers(\n    mut view: watch::Receiver\u003cClusterView\u003e,\n    mesh: \u0026mut Mesh,\n    mut new_peers: mpsc::UnboundedReceiver\u003cMeshPeer\u003e,\n    peers: watch::Sender\u003cVec\u003cMeshPeer\u003e\u003e,\n    resync_interval: Duration,\n) {\n    // Peers to configure.\n    let mut pending: Vec\u003cMeshPeer\u003e = Vec::new();\n    // The gossip view of the last update.\n    let mut last_known: Vec\u003cMeshPeer\u003e = Vec::new();\n    loop {\n        let known = good_known_peers(\u0026view.borrow_and_update());\n        let peers_diff = get_gossip_changes(\u0026last_known, \u0026known);\n        for peer in peers_diff.changed {\n            add_pending(\u0026mut pending, peer);\n        }\n        for peer in \u0026peers_diff.gone {\n            pending.retain(|p| p.public_key != peer.public_key);\n            mesh.remove_peer(peer);\n        }\n        last_known = known;\n\n        // Configure the queue one by one. A failed peer stays for the next update.\n        let mut failed = Vec::new();\n        for peer in pending.drain(..) {\n            if let Err(err) = mesh.add_peer(\u0026peer) {\n                tracing::error!(node_id = %peer.node_id, mesh_ip = %peer.mesh_ip, \"cannot configure mesh peer: {err:#}\");\n                failed.push(peer);\n            }\n        }\n        pending = failed;\n\n        // The join server must also see the queued peers.\n        peers.send_replace(mesh.peers().iter().chain(\u0026pending).cloned().collect());\n\n        tokio::select! {\n            changed = view.changed() =\u003e {\n                if changed.is_err() {\n                    return;\n                }\n            }\n            // No branch when all senders are gone: then only gossip and the timer wake the loop.\n            Some(peer) = new_peers.recv() =\u003e add_pending(\u0026mut pending, peer),\n            _ = tokio::time::sleep(resync_interval) =\u003e {}\n        }\n    }\n}\n","traces":[{"line":67,"address":[13726032,13726453,13726447],"length":1,"stats":{"Line":1}},{"line":69,"address":[12221750],"length":1,"stats":{"Line":1}},{"line":70,"address":[13726110],"length":1,"stats":{"Line":1}},{"line":71,"address":[13726163],"length":1,"stats":{"Line":1}},{"line":72,"address":[12143746],"length":1,"stats":{"Line":1}},{"line":78,"address":[12222688],"length":1,"stats":{"Line":1}},{"line":79,"address":[12209040,12222718],"length":1,"stats":{"Line":2}},{"line":80,"address":[12209058],"length":1,"stats":{"Line":1}},{"line":81,"address":[12209074],"length":1,"stats":{"Line":1}},{"line":82,"address":[12126176,12129630,12126194],"length":1,"stats":{"Line":3}},{"line":84,"address":[13727091],"length":1,"stats" ine":0}},{"line":381,"address":[12137767],"length":1,"stats":{"Line":0}},{"line":383,"address":[13720428,13725284],"length":1,"stats":{"Line":0}},{"line":384,"address":[12138088,12127433,12127408],"length":1,"stats":{"Line":0}},{"line":385,"address":[12219581],"length":1,"stats":{"Line":0}},{"line":387,"address":[12215042,12215101],"length":1,"stats":{"Line":0}},{"line":390,"address":[12138287],"length":1,"stats":{"Line":0}},{"line":391,"address":[12142663,12138430,12138355,12138554],"length":1,"stats":{"Line":0}},{"line":392,"address":[13721210,13723257],"length":1,"stats":{"Line":0}},{"line":393,"address":[12140898,12141415,12140800],"length":1,"stats":{"Line":0}},{"line":394,"address":[12141275],"length":1,"stats":{"Line":0}},{"line":397,"address":[12138759,12138819],"length":1,"stats":{"Line":0}},{"line":400,"address":[12138920],"length":1,"stats":{"Line":0}},{"line":402,"address":[12136064,12139225],"length":1,"stats":{"Line":0}}],"covered":60,"coverable":134},{"path":["/","home","runner","work","yaco","yaco","crates","yaco-agent","src","mesh","tests.rs"],"content":"#![cfg(test)]\n\nuse super::*;\n\nuse std::collections::BTreeMap;\n\n// Base64 of 32 bytes of 0x11, of 0x22 and of 0x55,\n// so the keys are easy to tell apart at a glance.\nconst KEY_NODE_1: \u0026str = \"ERERERERERERERERERERERERERERERERERERERERERE=\";\nconst KEY_NODE_2: \u0026str = \"IiIiIiIiIiIiIiIiIiIiIiIiIiIiIiIiIiIiIiIiIiI=\";\n/// The new key of `node-1` after a restart.\nconst KEY_NODE_1_RESTARTED: \u0026str = \"VVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVU=\";\n\n/// The tests use their own subnets, not the default of the config,\n/// so a change of the default does not break them.\nfn subnet(text: \u0026str) -\u003e MeshSubnet {\n    text.parse().unwrap()\n}\n\nfn peer(node_id: \u0026str, public_key: \u0026str, mesh_ip: [u8; 4]) -\u003e MeshPeer {\n    MeshPeer {\n        node_id: node_id.to_string(),\n        public_key: Key::try_from(public_key).unwrap(),\n        mesh_ip: Ipv4Addr::from(mesh_ip),\n        endpoint: \"192.0.2.1:7281\".parse().unwrap(),\n    }\n}\n\n#[test]\nfn mesh_ip_is_stable() {\n    // If these values change, nodes get new addresses after an upgrade.\n    let net = subnet(\"10.42.0.0/16\");\n    assert_eq!(net.mesh_ip(\"node-1\", 0), Ipv4Addr::new(10, 42, 58, 124));\n    assert_eq!(\n        subnet(\"192.168.0.0/24\").mesh_ip(\"node-1\", 0),\n        Ipv4Addr::new(192, 168, 0, 140)\n    );\n    assert_ne!(net.mesh_ip(\"node-1\", 0), net.mesh_ip(\"node-1\", 1));\n    assert_ne!(net.mesh_ip(\"node-1\", 0), net.mesh_ip(\"node-2\", 0));\n}\n\n#[test]\nfn mesh_ip_is_a_host_in_the_subnet() {\n    for text in [\n        \"10.42.0.0/16\",\n        \"192.168.4.0/24\",\n        \"172.16.0.0/12\",\n        \"10.0.0.8/30\",\n    ] {\n        let net = subnet(text);\n        for attempt in 0..10_000 {\n            let ip = net.mesh_ip(\"node\", attempt);\n            assert!(net.is_host(ip), \"{text}, attempt {attempt}: {ip}\");\n        }\n    }\n}\n\n#[test]\nfn mesh_ip_uses_both_hosts_of_a_30() {\n    let net = subnet(\"10.0.0.8/30\");\n    let ips: std::collections::BTreeSet\u003cIpv4Addr\u003e = (0..100)\n        .map(|attempt| net.mesh_ip(\"node\", attempt))\n        .collect();\n    assert_eq!(\n        ips.into_iter().collect::\u003cVec\u003c_\u003e\u003e(),\n        vec![Ipv4Addr::new(10, 0, 0, 9), Ipv4Addr::new(10, 0, 0, 10)]\n    );\n}\n\n#[test]\nfn subnet_without_room_for_hosts_or_with_host_bits_is_refused() {\n    assert!(\"10.42.0.0/30\".parse::\u003cMeshSubnet\u003e().is_ok());\n    assert!(\"10.42.0.0/31\".parse::\u003cMeshSubnet\u003e().is_err());\n    assert!(\"10.42.0.1/32\".parse::\u003cMeshSubnet\u003e().is_err());\n    assert!(\"10.42.1.0/16\".parse::\u003cMeshSubnet\u003e().is_err());\n    assert!(\"not a subnet\".parse::\u003cMeshSubnet\u003e().is_err());\n}\n\n#[test]\nfn subnet_is_a_plain_string_in_json() {\n    // The config fingerprint depends on this form.\n    let net = subnet(\"10.42.0.0/16\");\n    assert_eq!(serde_json::to_string(\u0026net).unwrap(), \"\\\"10.42.0.0/16\\\"\");\n    assert_eq!(\n        serde_json::from_str::\u003cMeshSubnet\u003e(\"\\\"10.42.0.0/16\\\"\").unwrap(),\n        net\n    );\n    assert!(serde_json::from_str::\u003cMeshSubnet\u003e(\"\\\"10.42.1.0/16\\\"\").is_err());\n}\n\n#[test]\nfn is_host_accepts_hosts_only() {\n    let net = subnet(\"10.42.0.0/16\");\n    assert!(net.is_host(Ipv4Addr::new(10, 42, 0, 1)));\n    assert!(net.is_host(Ipv4Addr::new(10, 42, 255, 254)));\n    assert!(!net.is_host(Ipv4Addr::new(10, 42, 0, 0)));\n    assert!(!net.is_host(Ipv4Addr::new(10, 42, 255, 255)));\n    assert!(!net.is_host(Ipv4Addr::new(10, 43, 0, 1)));\n    assert!(!net.is_host(Ipv4Addr::new(10, 41, 255, 254)));\n}\n\n#[test]\nfn own_facts_come_from_the_config() {\n    let config = Config::parse(\n        \"[node]\\nid = \\\"node-1\\\"\\npublic_ip = \\\"192.0.2.1\\\"\\nmesh_port = 9001\\n\\\n         [cluster]\\nmesh_subnet = \\\"10.42.0.0/16\\\"\\n\",\n    )\n    .unwrap();\n    let key = Key::try_from(KEY_NODE_1).unwrap();\n\n    let own = MeshPeer::own(\u0026config, \u0026key, 1);\n    assert_eq!(own.node_id, \"node-1\");\n    assert_eq!(own.public_key, key);\n    assert_eq!(own.mesh_ip, subnet(\"10.42.0.0/16\").mesh_ip(\"node-1\", 1));\n    assert_eq!(own.endpoint, \"192.0.2.1:9001\".parse().unwrap());\n}\n\n/// A node of the cluster view with the facts of `peer`.\nfn node(peer: \u0026MeshPeer, liveness: Liveness) -\u003e Node {\n    let facts = peer\n        .to_facts()\n        .into_iter()\n        .map(|(key, value)| (key.strip_prefix(FACTS_PREFIX).unwrap().to_string(), value))\n        .collect();\n    Node {\n        id: peer.node_id.clone(),\n        generation: 1,\n        liveness,\n        facts,\n    }\n}\n\nmod from_node {\n    use super::*;\n\n    #[test]\n    fn facts_round_trip() {\n        let original = peer(\"node-1\", KEY_NODE_1, [10, 42, 0, 1]);\n        let node = node(\u0026original, Liveness::Live);\n        assert_eq!(MeshPeer::from_node(\u0026node).unwrap(), original);\n    }\n\n    #[test]\n    fn bad_facts_are_errors() {\n        let parse = |pairs: \u0026[(\u0026str, \u0026str)]| {\n            let node = Node {\n                id: \"node-1\".to_string(),\n                generation: 1,\n                liveness: Liveness::Live,\n                facts: pairs\n                    .iter()\n                    .map(|(name, value)| (name.to_string(), value.to_string()))\n                    .collect(),\n            };\n            MeshPeer::from_node(\u0026node)\n        };\n        let key = (WG_PUBLIC_KEY_FACT, KEY_NODE_1);\n        let ip = (MESH_IP_FACT, \"10.42.0.1\");\n        let endpoint = (ENDPOINT_FACT, \"192.0.2.1:7281\");\n        assert!(parse(\u0026[key, ip, endpoint]).is_ok());\n\n        assert!(parse(\u0026[ip, endpoint]).is_err());\n        assert!(parse(\u0026[(WG_PUBLIC_KEY_FACT, \"not a key\"), ip, endpoint]).is_err());\n        assert!(parse(\u0026[key, (MESH_IP_FACT, \"10.42.0\"), endpoint]).is_err());\n        assert!(parse(\u0026[key, ip]).is_err());\n        assert!(parse(\u0026[key, ip, (ENDPOINT_FACT, \"192.0.2.1\")]).is_err());\n    }\n}\n\n#[test]\nfn a_queued_peer_replaces_the_older_queued_peer_of_the_same_node() {\n    let mut pending = Vec::new();\n    add_pending(\u0026mut pending, peer(\"node-1\", KEY_NODE_1, [10, 42, 0, 1]));\n    add_pending(\u0026mut pending, peer(\"node-2\", KEY_NODE_2, [10, 42, 0, 2]));\n    // node-1 restarted and joined again, with a new key and another IP.\n    let restarted = peer(\"node-1\", KEY_NODE_1_RESTARTED, [10, 42, 0, 9]);\n    add_pending(\u0026mut pending, restarted.clone());\n    assert_eq!(\n        pending,\n        vec![peer(\"node-2\", KEY_NODE_2, [10, 42, 0, 2]), restarted]\n    );\n}\n\nmod gossip_changes {\n    use super::*;\n\n    #[test]\n    fn equal_views_have_no_changes() {\n        let view = vec![peer(\"node-1\", KEY_NODE_1, [10, 42, 0, 1])];\n        assert_eq!(get_gossip_changes(\u0026view, \u0026view), PeersDiff::default());\n    }\n\n    #[test]\n    fn a_new_node_is_changed() {\n        let old = vec![peer(\"node-1\", KEY_NODE_1, [10, 42, 0, 1])];\n        let new = vec![\n            peer(\"node-1\", KEY_NODE_1, [10, 42, 0, 1]),\n            peer(\"node-2\", KEY_NODE_2, [10, 42, 0, 2]),\n        ];\n        assert_eq!(\n            get_gossip_changes(\u0026old, \u0026new),\n            PeersDiff {\n                changed: vec![peer(\"node-2\", KEY_NODE_2, [10, 42, 0, 2])],\n                gone: Vec::new(),\n            }\n        );\n    }\n\n    #[test]\n    fn a_restarted_node_is_changed_not_gone() {\n        let old = vec![peer(\"node-1\", KEY_NODE_1, [10, 42, 0, 1])];\n        let new = vec![peer(\"node-1\", KEY_NODE_1_RESTARTED, [10, 42, 0, 1])];\n        assert_eq!(\n            get_gossip_changes(\u0026old, \u0026new),\n            PeersDiff {\n                changed: new.clone(),\n                gone: Vec::new()\n            }\n        );\n    }\n\n    #[test]\n    fn a_missing_node_is_gone() {\n        let old = vec![\n            peer(\"node-1\", KEY_NODE_1, [10, 42, 0, 1]),\n            peer(\"node-2\", KEY_NODE_2, [10, 42, 0, 2]),\n        ];\n        let new = vec![peer(\"node-1\", KEY_NODE_1, [10, 42, 0, 1])];\n        assert_eq!(\n            get_gossip_changes(\u0026old, \u0026new),\n            PeersDiff {\n                changed: Vec::new(),\n                gone: vec![peer(\"node-2\", KEY_NODE_2, [10, 42, 0, 2])],\n            }\n        );\n    }\n}\n\nmod good_known_peers {\n    use super::*;\n\n    /// The view of node-1, with `nodes` and node-1 itself.\n    fn view_of_node_1(nodes: Vec\u003cNode\u003e) -\u003e ClusterView {\n        let mut view = ClusterView::empty(\"node-1\");\n        let own = node(\u0026peer(\"node-1\", KEY_NODE_1, [10, 42, 0, 1]), Liveness::Live);\n        for node in std::iter::once(own).chain(nodes) {\n            view.nodes.insert(node.id.clone(), node);\n        }\n        view\n    }\n\n    #[test]\n    fn returns_every_other_node_live_or_dead() {\n        let node_2 = peer(\"node-2\", KEY_NODE_2, [10, 42, 0, 2]);\n        let node_3 = peer(\"node-3\", KEY_NODE_1_RESTARTED, [10, 42, 0, 3]);\n        let view = view_of_node_1(vec![\n            node(\u0026node_2, Liveness::Live),\n            node(\u0026node_3, Liveness::Dead),\n        ]);\n        assert_eq!(good_known_peers(\u0026view), vec![node_2, node_3]);\n    }\n\n    #[test]\n    fn skips_nodes_that_left() {\n        let node_2 = peer(\"node-2\", KEY_NODE_2, [10, 42, 0, 2]);\n        let view = view_of_node_1(vec![node(\u0026node_2, Liveness::Leaving)]);\n        assert!(good_known_peers(\u0026view).is_empty());\n    }\n\n    #[test]\n    fn skips_nodes_with_bad_or_missing_facts() {\n        let mut bad_ip = node(\u0026peer(\"node-2\", KEY_NODE_2, [10, 42, 0, 2]), Liveness::Live);\n        bad_ip\n            .facts\n            .insert(MESH_IP_FACT.to_string(), \"not an ip\".to_string());\n        let no_facts = Node {\n            id: \"node-3\".to_string(),\n            generation: 1,\n            liveness: Liveness::Live,\n            facts: BTreeMap::new(),\n        };\n        let node_4 = peer(\"node-4\", KEY_NODE_2, [10, 42, 0, 4]);\n        let view = view_of_node_1(vec![bad_ip, no_facts, node(\u0026node_4, Liveness::Live)]);\n        assert_eq!(good_known_peers(\u0026view), vec![node_4]);\n    }\n}\n","traces":[],"covered":0,"coverable":0},{"path":["/","home","runner","work","yaco","yaco","crates","yaco-agent","src","test_util.rs"],"content":"//! Helpers for unit tests only.\n\nuse std::collections::HashSet;\n\nuse chitchat::{Chitchat, ChitchatId, DeletionStatus, VersionedValue};\nuse tokio::sync::watch;\n\nuse crate::config::ClusterConfig;\nuse crate::gossip;\n\npub fn chitchat_id(node_id: \u0026str, generation: u64) -\u003e ChitchatId {\n    ChitchatId::new(node_id, generation, \"127.0.0.1:7280\".parse().unwrap())\n}\n\n/// A chitchat instance of node `own`, with no network and no server task.\n/// `others` are node states that the instance knows, as gossip would bring them.\n/// So `Chitchat::node_states()` returns real node states for the tests.\npub fn chitchat_with_nodes(\n    own: \u0026ChitchatId,\n    own_key_values: Vec\u003c(String, String)\u003e,\n    others: Vec\u003c(ChitchatId, Vec\u003c(String, String)\u003e)\u003e,\n) -\u003e Chitchat {\n    let mut config = gossip::config(\n        \u0026own.node_id,\n        own.gossip_advertise_addr,\n        \u0026[],\n        \u0026ClusterConfig::default(),\n    );\n    config.chitchat_id = own.clone();\n    let (_seeds_tx, seeds_rx) = watch::channel(HashSet::new());\n    let mut chitchat = Chitchat::with_chitchat_id_and_seeds(config, seeds_rx, own_key_values);\n\n    for (id, key_values) in others {\n        let max_version = key_values.len() as u64;\n        let key_values = key_values.into_iter().enumerate().map(|(i, (key, value))| {\n            let versioned = VersionedValue {\n                value,\n                version: i as u64 + 1,\n                status: DeletionStatus::Set,\n            };\n            (key, versioned)\n        });\n        chitchat.reset_node_state_if_update(\u0026id, key_values, max_version, 0);\n    }\n    chitchat\n}\n\n/// Converts `(\u0026str, \u0026str)` pairs to owned key-value pairs.\npub fn key_values(pairs: \u0026[(\u0026str, \u0026str)]) -\u003e Vec\u003c(String, String)\u003e {\n    pairs\n        .iter()\n        .map(|(key, value)| (key.to_string(), value.to_string()))\n        .collect()\n}\n","traces":[],"covered":0,"coverable":0},{"path":["/","home","runner","work","yaco","yaco","crates","yaco-agent","src","view","mod.rs"],"content":"//! The cluster view: the only reader of chitchat state.\n//!\n//! `run` turns the chitchat state into a plain `ClusterView` and publishes it two ways:\n//!\n//! - `watch\u003cClusterView\u003e`: the latest view, for readers that need the current state\n//!   (the mesh peer sync, the membership log, `GET /v1/nodes`).\n//! - `broadcast\u003cEvent\u003e`: the changes between two views, for readers that need every change\n//!   (the event stream `GET /v1/events`).\n//!\n//! `build` and `changes` are pure functions, so they are easy to test.\n//! Membership hysteresis (architecture section 5.7) will go into `run` later.\n\nmod tests;\n\nuse std::collections::{BTreeMap, HashSet};\nuse std::sync::Arc;\nuse std::time::Duration;\n\nuse chitchat::{Chitchat, ChitchatHandle, ChitchatId};\nuse tokio::sync::{Notify, broadcast, watch};\nuse yaco_api::{Event, Liveness, Node};\n\nuse crate::gossip::LEAVING_KEY;\n\n/// Prefix of the fact keys in a chitchat namespace.\n/// The view shows the facts without it.\npub const FACTS_PREFIX: \u0026str = \"facts/\";\n\n/// How many events the broadcast channel keeps for a slow reader.\n/// A reader that falls further behind gets a new snapshot.\npub const EVENT_BUFFER: usize = 1024;\n\n/// All nodes that chitchat knows, as this node sees them.\n#[derive(Clone, Debug, PartialEq, Eq)]\npub struct ClusterView {\n    /// ID of this node.\n    pub self_id: String,\n    /// The latest generation of every node ID, this node included.\n    pub nodes: BTreeMap\u003cString, Node\u003e,\n}\n\nimpl ClusterView {\n    /// A view with no nodes, before the first update.\n    pub fn empty(self_id: \u0026str) -\u003e ClusterView {\n        ClusterView {\n            self_id: self_id.to_string(),\n            nodes: BTreeMap::new(),\n        }\n    }\n\n    /// The IDs of the live nodes, in order.\n    pub fn live_ids(\u0026self) -\u003e Vec\u003cString\u003e {\n        self.nodes\n            .values()\n            .filter(|node| node.liveness == Liveness::Live)\n            .map(|node| node.id.clone())\n            .collect()\n    }\n\n    /// Builds the view from the chitchat state.\n    ///\n    /// Takes only the latest generation of each node ID.\n    /// A restarted node has a new generation (and a new key),\n    /// and chitchat keeps the old generation as a dead node for a while.\n    pub fn from_chitchat(chitchat: \u0026Chitchat) -\u003e Self {\n        let live: HashSet\u003c\u0026ChitchatId\u003e = chitchat.live_nodes().collect();\n\n        let mut latest: BTreeMap\u003c\u0026str, \u0026ChitchatId\u003e = BTreeMap::new();\n        for id in chitchat.node_states().keys() {\n            let is_newer = match latest.get(\u0026*id.node_id) {\n                Some(known) =\u003e id.generation_id \u003e known.generation_id,\n                None =\u003e true,\n            };\n            if is_newer {\n                latest.insert(\u0026id.node_id, id);\n            }\n        }\n\n        let mut nodes = BTreeMap::new();\n        for (node_id, id) in latest {\n            let state = \u0026chitchat.node_states()[id];\n            // A leaving node can still be live for the failure detector.\n            let liveness = if state.get(LEAVING_KEY).is_some() {\n                Liveness::Leaving\n            } else if live.contains(id) {\n                Liveness::Live\n            } else {\n                Liveness::Dead\n            };\n            let facts = state\n                .key_values()\n                .filter_map(|(key, value)| {\n                    let name = key.strip_prefix(FACTS_PREFIX)?;\n                    Some((name.to_string(), value.to_string()))\n                })\n                .collect();\n            let node = Node {\n                id: node_id.to_string(),\n                generation: id.generation_id,\n                liveness,\n                facts,\n            };\n            nodes.insert(node_id.to_string(), node);\n        }\n\n        Self {\n            self_id: chitchat.self_chitchat_id().node_id.to_string(),\n            nodes,\n        }\n    }\n}\n\n/// Returns the events that turn `old` into `new`, in the order of the node IDs.\npub fn get_view_changes(old: \u0026ClusterView, new: \u0026ClusterView) -\u003e Vec\u003cEvent\u003e {\n    let mut events = Vec::new();\n    for (id, node) in \u0026new.nodes {\n        match old.nodes.get(id) {\n            None =\u003e events.push(Event::NodeAdded { node: node.clone() }),\n            Some(old_node) if old_node != node =\u003e {\n                events.push(Event::NodeChanged { node: node.clone() })\n            }\n            Some(_) =\u003e {}\n        }\n    }\n    for id in old.nodes.keys() {\n        if !new.nodes.contains_key(id) {\n            events.push(Event::NodeRemoved { id: id.clone() });\n        }\n    }\n    events\n}\n\n/// The snapshot event of a view.\npub fn snapshot(view: \u0026ClusterView) -\u003e Event {\n    Event::Snapshot {\n        nodes: view.nodes.values().cloned().collect(),\n    }\n}\n\n/// Keeps `view` equal to the chitchat state, and sends every change to `events`.\n///\n/// Updates on every change of the live set, on every key change,\n/// and every `resync_interval`, to see the nodes that chitchat forgot.\n/// Returns when chitchat stops.\npub async fn run(\n    handle: \u0026ChitchatHandle,\n    view: watch::Sender\u003cClusterView\u003e,\n    events: broadcast::Sender\u003cEvent\u003e,\n    resync_interval: Duration,\n) {\n    let key_changed = Arc::new(Notify::new());\n    // The listener stays subscribed while `_listener` exists.\n    let (mut watcher, _listener) = {\n        let chitchat = handle.chitchat();\n        let chitchat = chitchat.lock().await;\n        let notify = key_changed.clone();\n        let listener = chitchat.subscribe_event(\"\", move |_| notify.notify_one());\n        (chitchat.live_nodes_watcher(), listener)\n    };\n\n    loop {\n        // The live set is only the trigger. Mark it as seen.\n        watcher.borrow_and_update();\n        let new = ClusterView::from_chitchat(\u0026*handle.chitchat().lock().await);\n        let changes = get_view_changes(\u0026view.borrow(), \u0026new);\n        if !changes.is_empty() {\n            // The view first, so that a reader that gets an event\n            // and then reads the view sees the change.\n            view.send_replace(new);\n            for event in changes {\n                // An error only means that nobody listens now.\n                let _ = events.send(event);\n            }\n        }\n\n        tokio::select! {\n            changed = watcher.changed() =\u003e {\n                if changed.is_err() {\n                    return;\n                }\n            }\n            _ = key_changed.notified() =\u003e {}\n            _ = tokio::time::sleep(resync_interval) =\u003e {}\n        }\n    }\n}\n\n/// Logs the live node set every time it changes.\n/// Returns when the view task stops.\npub async fn log_membership(mut view: watch::Receiver\u003cClusterView\u003e) {\n    let mut logged: Vec\u003cString\u003e = Vec::new();\n    loop {\n        let live = view.borrow_and_update().live_ids();\n        // The first view before the first update is empty. Do not log it.\n        if live != logged {\n            tracing::info!(live = ?live, \"membership changed\");\n            logged = live;\n        }\n        if view.changed().await.is_err() {\n            return;\n        }\n    }\n}\n","traces":[{"line":44,"address":[13552608,13552758,13552764],"length":1,"stats":{"Line":1}},{"line":46,"address":[12555480],"length":1,"stats":{"Line":3}},{"line":47,"address":[14269718],"length":1,"stats":{"Line":1}},{"line":52,"address":[13552784],"length":1,"stats":{"Line":1}},{"line":53,"address":[12555657],"length":1,"stats":{"Line":1}},{"line":55,"address":[12555675,12542464,12542478],"length":1,"stats":{"Line":3}},{"line":56,"address":[14256736,14256771,14269918],"length":1,"stats":{"Line":3}},{"line":65,"address":[12553392,12555175,12555440],"length":1,"stats":{"Line":3}},{"line":66,"address":[13550647],"length":1,"stats":{"Line":3}},{"line":68,"address":[14267729],"length":1,"stats":{"Line":3}},{"line":69,"address":[14267800,14267873],"length":1,"stats":{"Line":4}},{"line":70,"address":[14269437,14268040],"length":1,"stats":{"Line":3}},{"line":71,"address line":199,"address":[12544784,12546350,12544133,12544164,12544013,12544411],"length":1,"stats":{"Line":0}}],"covered":44,"coverable":69},{"path":["/","home","runner","work","yaco","yaco","crates","yaco-agent","src","view","tests.rs"],"content":"#![cfg(test)]\n\nuse super::*;\nuse crate::test_util::{chitchat_id, chitchat_with_nodes, key_values};\n\nfn node(id: \u0026str, generation: u64, liveness: Liveness) -\u003e Node {\n    Node {\n        id: id.to_string(),\n        generation,\n        liveness,\n        facts: BTreeMap::new(),\n    }\n}\n\nfn view(nodes: Vec\u003cNode\u003e) -\u003e ClusterView {\n    let mut view = ClusterView::empty(\"n1\");\n    for node in nodes {\n        view.nodes.insert(node.id.clone(), node);\n    }\n    view\n}\n\n/// `chitchat_with_nodes` adds the other nodes without heartbeats,\n/// so the failure detector never hears them, and they are dead.\nmod build {\n    use super::*;\n\n    #[test]\n    fn has_every_node_with_its_facts_and_liveness() {\n        let chitchat = chitchat_with_nodes(\n            \u0026chitchat_id(\"n1\", 1),\n            key_values(\u0026[(\"facts/mesh_ip\", \"10.42.0.1\")]),\n            vec![(\n                chitchat_id(\"n2\", 5),\n                key_values(\u0026[(\"facts/mesh_ip\", \"10.42.0.2\"), (\"other\", \"x\")]),\n            )],\n        );\n\n        let view = ClusterView::from_chitchat(\u0026chitchat);\n\n        assert_eq!(view.self_id, \"n1\");\n        assert_eq!(view.nodes.keys().collect::\u003cVec\u003c_\u003e\u003e(), vec![\"n1\", \"n2\"]);\n        assert_eq!(view.nodes[\"n1\"].liveness, Liveness::Live);\n        let n2 = \u0026view.nodes[\"n2\"];\n        assert_eq!(n2.generation, 5);\n        assert_eq!(n2.liveness, Liveness::Dead);\n        // Only facts, without the prefix.\n        let facts: Vec\u003c_\u003e = n2.facts.iter().collect();\n        assert_eq!(\n            facts,\n            vec![(\u0026\"mesh_ip\".to_string(), \u0026\"10.42.0.2\".to_string())]\n        );\n    }\n\n    #[test]\n    fn a_node_with_the_leaving_key_is_leaving() {\n        let chitchat = chitchat_with_nodes(\n            \u0026chitchat_id(\"n1\", 1),\n            Vec::new(),\n            vec![(chitchat_id(\"n2\", 1), key_values(\u0026[(LEAVING_KEY, \"true\")]))],\n        );\n        let view = ClusterView::from_chitchat(\u0026chitchat);\n        assert_eq!(view.nodes[\"n2\"].liveness, Liveness::Leaving);\n        assert!(view.nodes[\"n2\"].facts.is_empty());\n    }\n\n    #[test]\n    fn takes_the_latest_generation_of_a_restarted_node() {\n        let chitchat = chitchat_with_nodes(\n            \u0026chitchat_id(\"n1\", 1),\n            Vec::new(),\n            vec![\n                // The order does not matter.\n                (\n                    chitchat_id(\"n2\", 200),\n                    key_values(\u0026[(\"facts/mesh_ip\", \"10.42.0.2\")]),\n                ),\n                (\n                    chitchat_id(\"n2\", 100),\n                    key_values(\u0026[(\"facts/mesh_ip\", \"10.42.0.9\")]),\n                ),\n            ],\n        );\n        let n2 = \u0026ClusterView::from_chitchat(\u0026chitchat).nodes[\"n2\"];\n        assert_eq!(n2.generation, 200);\n        assert_eq!(n2.facts[\"mesh_ip\"], \"10.42.0.2\");\n    }\n\n    #[test]\n    fn a_leaving_latest_generation_hides_the_older_ones() {\n        // The old generation crashed, the new one left gracefully.\n        let chitchat = chitchat_with_nodes(\n            \u0026chitchat_id(\"n1\", 1),\n            Vec::new(),\n            vec![\n                (\n                    chitchat_id(\"n2\", 100),\n                    key_values(\u0026[(\"facts/mesh_ip\", \"10.42.0.9\")]),\n                ),\n                (chitchat_id(\"n2\", 200), key_values(\u0026[(LEAVING_KEY, \"true\")])),\n            ],\n        );\n        let n2 = \u0026ClusterView::from_chitchat(\u0026chitchat).nodes[\"n2\"];\n        assert_eq!(n2.generation, 200);\n        assert_eq!(n2.liveness, Liveness::Leaving);\n    }\n\n    #[test]\n    fn a_restarted_own_node_is_live_only_in_its_new_generation() {\n        let chitchat = chitchat_with_nodes(\n            \u0026chitchat_id(\"n1\", 200),\n            Vec::new(),\n            vec![(chitchat_id(\"n1\", 100), Vec::new())],\n        );\n        let n1 = \u0026ClusterView::from_chitchat(\u0026chitchat).nodes[\"n1\"];\n        assert_eq!(n1.generation, 200);\n        assert_eq!(n1.liveness, Liveness::Live);\n    }\n}\n\nmod changes {\n    use super::*;\n\n    #[test]\n    fn equal_views_have_no_changes() {\n        let view = view(vec![node(\"n1\", 1, Liveness::Live)]);\n        assert!(get_view_changes(\u0026view, \u0026view).is_empty());\n    }\n\n    #[test]\n    fn a_new_node_is_added() {\n        let old = view(vec![node(\"n1\", 1, Liveness::Live)]);\n        let new = view(vec![\n            node(\"n1\", 1, Liveness::Live),\n            node(\"n2\", 1, Liveness::Live),\n        ]);\n        assert_eq!(\n            get_view_changes(\u0026old, \u0026new),\n            vec![Event::NodeAdded {\n                node: node(\"n2\", 1, Liveness::Live)\n            }]\n        );\n    }\n\n    #[test]\n    fn liveness_generation_and_facts_are_changes() {\n        let old = view(vec![node(\"n2\", 1, Liveness::Live)]);\n        let mut with_fact = node(\"n2\", 1, Liveness::Live);\n        with_fact\n            .facts\n            .insert(\"mesh_ip\".to_string(), \"10.42.0.2\".to_string());\n        for changed in [\n            node(\"n2\", 1, Liveness::Dead),\n            node(\"n2\", 1, Liveness::Leaving),\n            node(\"n2\", 2, Liveness::Live),\n            with_fact,\n        ] {\n            let new = view(vec![changed.clone()]);\n            assert_eq!(\n                get_view_changes(\u0026old, \u0026new),\n                vec![Event::NodeChanged { node: changed }]\n            );\n        }\n    }\n\n    #[test]\n    fn a_forgotten_node_is_removed() {\n        let old = view(vec![\n            node(\"n1\", 1, Liveness::Live),\n            node(\"n2\", 1, Liveness::Dead),\n        ]);\n        let new = view(vec![node(\"n1\", 1, Liveness::Live)]);\n        assert_eq!(\n            get_view_changes(\u0026old, \u0026new),\n            vec![Event::NodeRemoved {\n                id: \"n2\".to_string()\n            }]\n        );\n    }\n\n    #[test]\n    fn the_first_view_adds_every_node() {\n        let new = view(vec![\n            node(\"n1\", 1, Liveness::Live),\n            node(\"n2\", 1, Liveness::Dead),\n        ]);\n        let events = get_view_changes(\u0026ClusterView::empty(\"n1\"), \u0026new);\n        assert_eq!(events.len(), 2);\n        assert!(\n            events\n                .iter()\n                .all(|event| matches!(event, Event::NodeAdded { .. }))\n        );\n    }\n}\n\n#[test]\nfn live_ids_are_the_live_nodes_in_order() {\n    let view = view(vec![\n        node(\"n3\", 1, Liveness::Live),\n        node(\"n1\", 1, Liveness::Live),\n        node(\"n2\", 1, Liveness::Dead),\n        node(\"n4\", 1, Liveness::Leaving),\n    ]);\n    assert_eq!(view.live_ids(), vec![\"n1\", \"n3\"]);\n}\n","traces":[],"covered":0,"coverable":0},{"path":["/","home","runner","work","yaco","yaco","crates","yaco-agent","tests","loopback_cluster.rs"],"content":"//! Agents on loopback find each other through one seed,\n//! and a leaving agent disappears from the live set at once.\n\nuse std::net::SocketAddr;\nuse std::time::Duration;\n\nuse chitchat::ChitchatHandle;\nuse yaco_agent::config::ClusterConfig;\nuse yaco_agent::gossip;\n\n/// A short gossip interval keeps the tests fast.\nfn cluster() -\u003e ClusterConfig {\n    ClusterConfig {\n        gossip_interval: Duration::from_millis(100),\n        ..ClusterConfig::default()\n    }\n}\n\nconst CONVERGE_TIMEOUT: Duration = Duration::from_secs(10);\n\nfn addr(port: u16) -\u003e SocketAddr {\n    SocketAddr::from(([127, 0, 0, 1], port))\n}\n\n/// Starts node `names[0]` as the seed, and the others with it as seed.\nasync fn start_cluster(names: \u0026[\u0026str], first_port: u16) -\u003e Vec\u003cChitchatHandle\u003e {\n    let seed = addr(first_port);\n    let mut handles = Vec::new();\n    for (i, name) in names.iter().enumerate() {\n        let listen = addr(first_port + i as u16);\n        let seeds = if i == 0 { vec![] } else { vec![seed] };\n        let config = gossip::config(name, listen, \u0026seeds, \u0026cluster());\n        handles.push(gossip::start(config, Vec::new()).await.unwrap());\n    }\n    handles\n}\n\n/// Waits until every handle sees exactly `expected` as live nodes.\n/// Returns false on timeout.\nasync fn wait_for_live(handles: \u0026[ChitchatHandle], expected: \u0026[\u0026str], timeout: Duration) -\u003e bool {\n    let result = tokio::time::timeout(timeout, async {\n        loop {\n            let mut all_match = true;\n            for handle in handles {\n                if gossip::live_node_ids(handle).await != expected {\n                    all_match = false;\n                }\n            }\n            if all_match {\n                return;\n            }\n            tokio::time::sleep(cluster().gossip_interval).await;\n        }\n    })\n    .await;\n\n    for handle in handles {\n        println!(\n            \"{:?} sees {:?}\",\n            handle.chitchat_id(),\n            gossip::live_node_ids(handle).await\n        );\n    }\n    result.is_ok()\n}\n\n#[tokio::test]\nasync fn three_nodes_converge() {\n    let handles = start_cluster(\u0026[\"node-1\", \"node-2\", \"node-3\"], 17281).await;\n\n    assert!(\n        wait_for_live(\u0026handles, \u0026[\"node-1\", \"node-2\", \"node-3\"], CONVERGE_TIMEOUT).await,\n        \"cluster did not converge\"\n    );\n\n    for handle in handles {\n        handle.shutdown().await.unwrap();\n    }\n}\n\n#[tokio::test]\nasync fn leaving_node_is_removed_before_failure_detection() {\n    let mut handles = start_cluster(\u0026[\"node-1\", \"node-2\", \"node-3\"], 17291).await;\n    assert!(\n        wait_for_live(\u0026handles, \u0026[\"node-1\", \"node-2\", \"node-3\"], CONVERGE_TIMEOUT).await,\n        \"cluster did not converge\"\n    );\n\n    let node_3 = handles.pop().unwrap();\n    gossip::leave(node_3, \u0026cluster()).await.unwrap();\n\n    // The failure detector needs several seconds to mark a node dead.\n    // A graceful leave must be visible much sooner.\n    assert!(\n        wait_for_live(\u0026handles, \u0026[\"node-1\", \"node-2\"], Duration::from_secs(1)).await,\n        \"leaving node is still live\"\n    );\n\n    for handle in handles {\n        handle.shutdown().await.unwrap();\n    }\n}\n","traces":[{"line":1,"address":[11669901,11669888],"length":1,"stats":{"Line":2}},{"line":12,"address":[11669920],"length":1,"stats":{"Line":2}},{"line":13,"address":[11669984],"length":1,"stats":{"Line":1}},{"line":14,"address":[11669937],"length":1,"stats":{"Line":2}},{"line":15,"address":[11669955],"length":1,"stats":{"Line":2}},{"line":17,"address":[11670316],"length":1,"stats":{"Line":1}},{"line":21,"address":[11669776],"length":1,"stats":{"Line":2}},{"line":22,"address":[11669796],"length":1,"stats":{"Line":2}},{"line":23,"address":[11669874],"length":1,"stats":{"Line":2}},{"line":26,"address":[11660668,11660360,11662469,11660096,11660155,11660309,11669632,11669650],"length":1,"stats":{"Line":8}},{"line":27,"address":[11660295],"length":1,"stats":{"Line":2}},{"line":28,"address":[11660410],"length":1,"stats":{"Line":2}},{"line":29,"address":[11660637,11661351,11660440,11660530],"length":1,"stats":{"Line":8}},{"line":30,"address":[11661448,11661604],"length":1,"stats":{"Line":4}},{"line":31,"address":[11661647,11661936],"length":1,"stats":{"Line":4}},{"line":32,"address":[11662024,11661895],"length":1,"stats":{"Line":4}},{"line":33,"address":[11660339,11660729,11662210,11660770,11638647,11661054,11661283,11662287,11660702],"length":1,"stats":{"Line":6}},{"line":34,"address":[11661946,11661313,11638707,11662475,11638662,11660994],"length":1,"stats":{"Lin ble":58},{"path":["/","home","runner","work","yaco","yaco","crates","yaco-agent","tests","netns_mesh.rs"],"content":"//! Runs `tests/netns/mesh.sh`: three agents in separate network namespaces\n//! join over the bootstrap tunnel and reach each other over the mesh.\n//! The script needs no root, but it needs some system tools,\n//! so the test is ignored by default:\n//!\n//!     cargo test -p yaco-agent --test netns_mesh -- --ignored\n\nuse std::process::Command;\n\n#[test]\n#[ignore = \"needs unshare, iproute2, ping and the WireGuard kernel module; run with --ignored\"]\nfn three_nodes_reach_each_other_over_the_mesh() {\n    let script = concat!(env!(\"CARGO_MANIFEST_DIR\"), \"/tests/netns/mesh.sh\");\n    let status = Command::new(\"sh\")\n        .arg(script)\n        .env(\"YACO_AGENT\", env!(\"CARGO_BIN_EXE_yaco-agent\"))\n        .status()\n        .expect(\"cannot run the netns script\");\n    assert!(status.success(), \"{script} failed\");\n}\n","traces":[{"line":1,"address":[396656,396669],"length":1,"stats":{"Line":2}},{"line":12,"address":[396464,396688,396482,397047,397053],"length":1,"stats":{"Line":0}},{"line":13,"address":[396695],"length":1,"stats":{"Line":0}},{"line":14,"address":[396716,396909],"length":1,"stats":{"Line":0}},{"line":15,"address":[396758],"length":1,"stats":{"Line":0}},{"line":16,"address":[396812],"length":1,"stats":{"Line":0}},{"line":17,"address":[396854],"length":1,"stats":{"Line":0}},{"line":18,"address":[396913,396870,396775],"length":1,"stats":{"Line":0}},{"line":19,"address":[396923],"length":1,"stats":{"Line":0}},{"line":20,"address":[397039,396501],"length":1,"stats":{"Line":0}}],"covered":1,"coverable":10},{"path":["/","home","runner","work","yaco","yaco","crates","yaco-api","src","lib.rs"],"content":"//! Definitions of the YACO node API: the paths and the request and response types.\n//!\n//! The agent serves the API, and its handlers use the paths from here,\n//! so the server and the clients (the CLI, third parties) share them.\n//! The OpenAPI spec comes from the handlers in the agent: `cargo run -p yaco-agent --example openapi`.\n\nmod tests;\n\nuse std::collections::BTreeMap;\n\nuse serde::{Deserialize, Serialize};\nuse utoipa::ToSchema;\n\n/// All container manifests.\npub const CONTAINERS_PATH: \u0026str = \"/v1/containers\";\n\n/// One container manifest. `{name}` is the name of the container.\npub const CONTAINER_PATH: \u0026str = \"/v1/containers/{name}\";\n\n/// All nodes of the cluster.\npub const NODES_PATH: \u0026str = \"/v1/nodes\";\n\n/// Stream of cluster events (server-sent events).\npub const EVENTS_PATH: \u0026str = \"/v1/events\";\n\n/// Header with the sender of a write request.\n/// Every write request must have it (architecture section 5.3).\npub const SENDER_HEADER: \u0026str = \"X-Yaco-Sender\";\n\n/// A container manifest: the desired state of one container.\n#[derive(Clone, Debug, PartialEq, Eq, Serialize, Deserialize, ToSchema)]\n#[serde(deny_unknown_fields)]\npub struct ContainerManifest {\n    /// Unique in the cluster.\n    /// Must be equal to the last segment of the path.\n    #[schema(example = \"web\")]\n    pub name: String,\n    /// Docker image reference.\n    #[schema(example = \"nginx:1.29\")]\n    pub image: String,\n    /// Replaces the command of the image.\n    /// Empty: the container runs the command of the image.\n    #[serde(default, skip_serializing_if = \"Vec::is_empty\")]\n    #[schema(example = json!([\"nginx\", \"-g\", \"daemon off;\"]))]\n    pub command: Vec\u003cString\u003e,\n    /// Environment variables.\n    /// Keys that start with `YACO_` are reserved for the agent.\n    #[serde(default, skip_serializing_if = \"BTreeMap::is_empty\")]\n    #[schema(example = json!({\"TZ\": \"UTC\"}))]\n    pub env: BTreeMap\u003cString, String\u003e,\n}\n\n/// Body of every failed request.\n#[derive(Clone, Debug, PartialEq, Eq, Serialize, Deserialize, ToSchema)]\npub struct ErrorResponse {\n    /// What went wrong, for people.\n    #[schema(example = \"no container has the name \\\"web\\\"\")]\n    pub message: String,\n}\n\n/// Liveness of a node, as this node sees it.\n#[derive(Clone, Copy, Debug, PartialEq, Eq, Serialize, Deserialize, ToSchema)]\n#[serde(rename_all = \"snake_case\")]\npub enum Liveness {\n    /// The failure detector hears the node.\n    Live,\n    /// The failure detector does not hear the node.\n    /// It can come back, for example after a network cut.\n    Dead,\n    /// The node left the cluster gracefully.\n    Leaving,\n}\n\n/// One node of the cluster, as this node sees it.\n/// Only the latest generation of each node ID is shown.\n#[derive(Clone, Debug, PartialEq, Eq, Serialize, Deserialize, ToSchema)]\npub struct Node {\n    /// Node ID, chosen by the operator.\n    #[schema(example = \"n1\")]\n    pub id: String,\n    /// Start time of the agent, in seconds since the Unix epoch.\n    /// A restarted node has a new generation.\n    #[schema(example = 1790000000)]\n    pub generation: u64,\n    pub liveness: Liveness,\n    /// Facts that the node publishes about itself.\n    #[schema(example = json!({\n        \"wg_public_key\": \"ERERERERERERERERERERERERERERERERERERERERERE=\",\n        \"mesh_ip\": \"10.42.58.124\",\n        \"endpoint\": \"203.0.113.1:7281\"\n    }))]\n    pub facts: BTreeMap\u003cString, String\u003e,\n}\n\n/// One event of the event stream.\n///\n/// Every stream starts with `snapshot`.\n/// The other events carry the whole node, so a client can apply an event twice with no harm.\n#[derive(Clone, Debug, PartialEq, Eq, Serialize, Deserialize, ToSchema)]\n#[serde(tag = \"type\", rename_all = \"snake_case\")]\npub enum Event {\n    /// All nodes.\n    /// The first event of every stream,\n    /// and again when the stream was too slow and missed events.\n    Snapshot { nodes: Vec\u003cNode\u003e },\n    /// A node ID that this node did not know.\n    NodeAdded { node: Node },\n    /// A known node changed: its liveness, its generation or its facts.\n    /// A graceful leave is a change to `leaving`.\n    NodeChanged { node: Node },\n    /// This node forgot the node:\n    /// it was dead or leaving for longer than `cluster.dead_node_grace_period`.\n    NodeRemoved { id: String },\n}\n","traces":[],"covered":0,"coverable":0},{"path":["/","home","runner","work","yaco","yaco","crates","yaco-api","src","tests.rs"],"content":"#![cfg(test)]\n\nuse super::*;\n\n#[test]\nfn container_path_is_below_containers_path() {\n    assert_eq!(CONTAINER_PATH, format!(\"{CONTAINERS_PATH}/{{name}}\"));\n}\n\n#[test]\nfn minimal_manifest_has_only_name_and_image() {\n    let manifest: ContainerManifest =\n        serde_json::from_str(r#\"{\"name\": \"web\", \"image\": \"nginx:1.29\"}\"#).unwrap();\n    assert!(manifest.command.is_empty());\n    assert!(manifest.env.is_empty());\n    assert_eq!(\n        serde_json::to_string(\u0026manifest).unwrap(),\n        r#\"{\"name\":\"web\",\"image\":\"nginx:1.29\"}\"#\n    );\n}\n\n#[test]\nfn unknown_manifest_fields_are_errors() {\n    let result = serde_json::from_str::\u003cContainerManifest\u003e(\n        r#\"{\"name\": \"web\", \"image\": \"nginx:1.29\", \"imgae\": \"typo\"}\"#,\n    );\n    assert!(result.is_err());\n}\n\n#[test]\nfn events_are_tagged_with_their_type() {\n    let event = Event::NodeRemoved {\n        id: \"n1\".to_string(),\n    };\n    let json = serde_json::to_string(\u0026event).unwrap();\n    assert_eq!(json, r#\"{\"type\":\"node_removed\",\"id\":\"n1\"}\"#);\n    assert_eq!(serde_json::from_str::\u003cEvent\u003e(\u0026json).unwrap(), event);\n}\n\n#[test]\nfn liveness_is_snake_case() {\n    assert_eq!(\n        serde_json::to_string(\u0026Liveness::Leaving).unwrap(),\n        r#\"\"leaving\"\"#\n    );\n}\n","traces":[],"covered":0,"coverable":0}]};

    <script>const e = React.createElement;

function pathToString(path) {
  if (path[0] === '/') {
    return '/' + path.slice(1).join('/');
  } else {
    return path.join('/');
  }
}

function findCommonPath(files) {
  if (!files || !files.length) {
    return [];
  }

  function isPrefix(arr, prefix) {
    if (arr.length < prefix.length) {
      return false;
    }
    for (let i = prefix.length - 1; i >= 0; --i) {
      if (arr[i] !== prefix[i]) {
        return false;
      }
    }
    return true;
  }

  let commonPath = files[0].path.slice(0, -1);
  while (commonPath.length) {
    if (files.every(file => isPrefix(file.path, commonPath))) {
      break;
    }
    commonPath.pop();
  }
  return commonPath;
}

function findFolders(files) {
  if (!files || !files.length) {
    return [];
  }

  let folders = files.filter(file => file.path.length > 1).map(file => file.path[0]);
  folders = [...new Set(folders)]; // unique
  folders.sort();

  folders = folders.map(folder => {
    let filesInFolder = files
      .filter(file => file.path[0] === folder)
      .map(file => ({
        ...file,
        path: file.path.slice(1),
        parent: [...file.parent, file.path[0]],
      }));

    const children = findFolders(filesInFolder); // recursion

    return {
      is_folder: true,
      path: [folder],
      parent: files[0].parent,
      children,
      covered: children.reduce((sum, file) => sum + file.covered, 0),
      coverable: children.reduce((sum, file) => sum + file.coverable, 0),
      prevRun: children.some(file => file.prevRun) ? {
        covered: children.reduce((sum, file) => sum + (file.prevRun ? file.prevRun.covered : 0), 0),
        coverable: children.reduce((sum, file) => sum + (file.prevRun ? file.prevRun.coverable : 0), 0),
      } : null,
    };
  });

  return [...folders, ...files.filter(file => file.path.length === 1)];
}

class App extends React.Component {
  constructor(...args) {
    super(...args);

    this.state = {
      current: [],
      theme: document.documentElement.getAttribute('data-theme') || 'light',
    };
    this.updateStateFromLocation = this.updateStateFromLocation.bind(this);
    this.toggleTheme = this.toggleTheme.bind(this);
  }

  componentDidMount() {
    this.updateStateFromLocation();
    window.addEventListener('hashchange', this.updateStateFromLocation);
  }

  componentWillUnmount() {
    window.removeEventListener('hashchange', this.updateStateFromLocation);
  }

  updateStateFromLocation() {
    if (window.location.hash.length > 1) {
      const current = window.location.hash.slice(1).split('/').map(decodeURIComponent);
      this.setState({current});
    } else {
      this.setState({current: []});
    }
  }

  getCurrentPath() {
    let file = this.props.root;
    let path = [file];
    for (let p of this.state.current) {
      file = file.children.find(file => file.path[0] === p);
      if (!file) {
        return path;
      }
      path.push(file);
    }
    return path;
  }

  render() {
    const path = this.getCurrentPath();
    const file = path[path.length - 1];

    let w = null;
    if (file.is_folder) {
      w = e(FilesList, {
        folder: file,
        onSelectFile: this.selectFile.bind(this),
        onBack: path.length > 1 ? this.back.bind(this) : null,
        rootPath: this.props.root.path,
        theme: this.state.theme,
        onToggleTheme: this.toggleTheme,
      });
    } else {
      w = e(DisplayFile, {
        file,
        onBack: this.back.bind(this),
        rootPath: this.props.root.path,
        theme: this.state.theme,
        onToggleTheme: this.toggleTheme,
      });
    }

    return e('div', {className: 'app'}, w);
  }

  selectFile(file) {
    this.setState(
      ({current}) => {
        return {current: [...current, file.path[0]]};
      },
      () => this.updateHash(),
    );
  }

  back(file) {
    this.setState(
      ({current}) => {
        return {current: current.slice(0, current.length - 1)};
      },
      () => this.updateHash(),
    );
  }

  updateHash() {
    if (!this.state.current || !this.state.current.length) {
      window.location = '#';
    } else {
      window.location = '#' + this.state.current.map(encodeURIComponent).join('/');
    }
  }

  toggleTheme() {
    const theme = this.state.theme === 'dark' ? 'light' : 'dark';
    document.documentElement.setAttribute('data-theme', theme);
    try {
      window.localStorage.setItem('tarpaulin-theme', theme);
    } catch (_) {
      // Local files can be opened with storage disabled; the button still works.
    }
    this.setState({theme});
  }
}

function FilesList({folder, onSelectFile, onBack, rootPath, theme, onToggleTheme}) {
  let files = folder.children;
  return e(
    'div',
    {className: 'display-folder'},
    e(FileHeader, {file: folder, onBack, rootPath, theme, onToggleTheme}),
    e(
      'table',
      {className: 'files-list'},
      e('thead', {className: 'files-list__head'}, e('tr', null, e('th', null, 'Path'), e('th', null, 'Coverage'))),
      e(
        'tbody',
        {className: 'files-list__body'},
        files.map(file => e(File, {key: file.path[0], file, onClick: onSelectFile})),
      ),
    ),
  );
}

function File({file, onClick}) {
  const coverage = file.coverable ? (file.covered / file.coverable) * 100 : -1;
  const coverageDelta = file.prevRun && file.coverable && file.prevRun.coverable
    ? coverage - (file.prevRun.covered / file.prevRun.coverable) * 100
    : null;

  return e(
    'tr',
    {
      className:
        'files-list__file' +
        (coverage >= 0 && coverage < 50 ? ' files-list__file_low' : '') +
        (coverage >= 50 && coverage < 80 ? ' files-list__file_medium' : '') +
        (coverage >= 80 ? ' files-list__file_high' : '') +
        (file.is_folder ? ' files-list__file_folder' : ''),
    },
    e('td', null, e('button', {className: 'file-link', type: 'button', onClick: () => onClick(file)}, pathToString(file.path))),
    e(
      'td',
      null,
      file.covered + ' / ' + file.coverable + (coverage >= 0 ? ' (' + coverage.toFixed(2) + '%)' : ''),
      e(
        'span',
        {title: 'Change from the previous run'},
        coverageDelta !== null && coverageDelta !== 0 ? ` (${coverageDelta > 0 ? '+' : ''}${coverageDelta.toFixed(2)}%)` : '',
      ),
    ),
  );
}

function DisplayFile({file, onBack, rootPath, theme, onToggleTheme}) {
  return e('div', {className: 'display-file'}, e(FileHeader, {file, onBack, rootPath, theme, onToggleTheme}), e(FileContent, {file}));
}

function FileHeader({file, onBack, rootPath, theme, onToggleTheme}) {
  const coverage = file.coverable ? (file.covered / file.coverable) * 100 : null;
  const coverageDelta = file.prevRun && file.coverable && file.prevRun.coverable
    ? coverage - (file.prevRun.covered / file.prevRun.coverable) * 100
    : null;
  const fullPath = [...file.parent, ...file.path];
  const displayPath = pathToString(fullPath.slice(rootPath.length)) || 'Coverage report';

  return e(
    'div',
    {className: 'file-header'},
    onBack ? e('button', {className: 'file-header__back', type: 'button', onClick: onBack}, '← Back') : null,
    e('h1', {className: 'file-header__name', title: pathToString(fullPath)}, displayPath),
    e(
      'div',
      {className: 'file-header__stat'},
      file.covered + ' / ' + file.coverable + ' lines' + (coverage !== null ? ' (' + coverage.toFixed(2) + '%)' : ''),
      e(
        'span',
        {title: 'Change from the previous run'},
        coverageDelta !== null && coverageDelta !== 0 ? ` (${coverageDelta > 0 ? '+' : ''}${coverageDelta.toFixed(2)}%)` : '',
      ),
    ),
    e('button', {
      className: 'theme-toggle',
      type: 'button',
      onClick: onToggleTheme,
      'aria-label': theme === 'dark' ? 'Switch to light mode' : 'Switch to dark mode',
      'aria-pressed': theme === 'dark',
      title: theme === 'dark' ? 'Switch to light mode' : 'Switch to dark mode',
    }, theme === 'dark' ? '☀' : '☾'),
  );
}

function FileContent({file}) {
  return e(
    'pre',
    {className: 'file-content'},
    file.content.replace(/\r?\n$/, '').split(/\r?\n/).map((line, index) => {
      const trace = file.traces.find(trace => trace.line === index + 1);
      const hits = trace && trace.stats.Line;
      const covered = hits > 0;
      const uncovered = hits === 0;
      return e(
        'div',
        {className: 'code-text-container' + (covered ? ' line-covered' : '') + (uncovered ? ' line-uncovered' : ''), key: index},
        e('span', {className: 'line-number', 'aria-hidden': true}, index + 1),
        e(
          'code',
          {
            className: 'code-line' + (covered ? ' code-line_covered' : '') + (uncovered ? ' code-line_uncovered' : ''),
          },
          line
        ),
        e('span', {className: 'cover-indicator', title: covered ? `${hits} hits` : uncovered ? 'Not covered' : 'Not coverable'}, covered ? hits : uncovered ? '×' : ''),
      );
    }),
  );
}

(function () {
  const commonPath = findCommonPath(data.files);
  const prevFilesMap = new Map();

  previousData &&
    previousData.files.forEach(file => {
      const path = file.path.slice(commonPath.length).join('/');
      prevFilesMap.set(path, file);
    });

  const files = data.files.map(file => {
    const path = file.path.slice(commonPath.length);
    return {
      ...file,
      path,
      parent: commonPath,
      prevRun: prevFilesMap.get(path.join('/')) || null,
    };
  });

  const children = findFolders(files);

  const root = {
    is_folder: true,
    children,
    path: commonPath,
    parent: [],
    covered: children.reduce((sum, file) => sum + file.covered, 0),
    coverable: children.reduce((sum, file) => sum + file.coverable, 0),
    prevRun: previousData ? {
      covered: children.reduce((sum, file) => sum + (file.prevRun ? file.prevRun.covered : 0), 0),
      coverable: children.reduce((sum, file) => sum + (file.prevRun ? file.prevRun.coverable : 0), 0),
    } : null,
  };

  let theme;
  try {
    theme = window.localStorage.getItem('tarpaulin-theme');
  } catch (_) {}
  if (theme !== 'light' && theme !== 'dark') {
    theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
  }
  document.documentElement.setAttribute('data-theme', theme);

  ReactDOM.render(e(App, {root, prevFilesMap}), document.getElementById('root'));
})();
</script>
