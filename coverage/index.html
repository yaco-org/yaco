<!doctype html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Tarpaulin coverage report</title>
    <style>:root {
  color-scheme: light;
  --color: #182230;
  --muted: #596579;
  --bg: #f5f7fa;
  --surface: #fff;
  --surface-hover: #eef3fa;
  --border: #d9e1ea;
  --link: #2259a8;
  --focus: #176bd1;
  --red: #fff0f0;
  --yellow: #fff8e6;
  --green: #eaf8f0;
}

[data-theme='dark'] {
  color-scheme: dark;
  --color: #e8edf4;
  --muted: #a9b6c7;
  --bg: #111820;
  --surface: #1b2631;
  --surface-hover: #283746;
  --border: #354453;
  --link: #9bc4ff;
  --focus: #7eb7ff;
  --red: #43292d;
  --yellow: #403929;
  --green: #253d34;
}

*,
*::before,
*::after {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  min-height: 100%;
  color: var(--color);
  background: var(--bg);
  font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  -webkit-font-smoothing: antialiased;
}

button {
  font: inherit;
}

button:focus-visible {
  outline: 2px solid var(--focus);
  outline-offset: 2px;
}

.app {
  max-width: 1400px;
  margin: 0 auto;
  padding: 24px;
}

.file-header {
  position: sticky;
  z-index: 2;
  top: 0;
  display: flex;
  align-items: center;
  gap: 12px;
  min-height: 72px;
  padding: 12px 16px;
  background: var(--surface);
  border-radius: 12px;
  box-shadow: 0 1px 3px #11182718, 0 8px 24px #1118270a;
}

.file-header__back,
.theme-toggle {
  flex: none;
  min-width: 40px;
  min-height: 40px;
  padding: 8px 12px;
  color: var(--link);
  background: transparent;
  border: 0;
  border-radius: 8px;
  cursor: pointer;
}

.file-header__back:hover,
.theme-toggle:hover {
  background: var(--surface-hover);
}

.file-header__name {
  flex: 1;
  min-width: 0;
  margin: 0;
  overflow-wrap: anywhere;
  font-size: 1.1rem;
  line-height: 1.4;
  font-weight: 650;
  text-wrap: balance;
}

.file-header__stat {
  flex: none;
  color: var(--muted);
  font-size: 0.9rem;
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
}

.theme-toggle {
  font-size: 1.35rem;
  line-height: 1;
}

.files-list {
  width: 100%;
  margin-top: 16px;
  border-spacing: 0;
  overflow: hidden;
  background: var(--surface);
  border-radius: 12px;
  box-shadow: 0 1px 3px #11182718, 0 8px 24px #1118270a;
}

.files-list__head th {
  padding: 14px 16px;
  color: var(--muted);
  text-align: left;
  font-size: 0.8rem;
  font-weight: 650;
  text-transform: uppercase;
  letter-spacing: 0.05em;
}

.files-list__head th:last-child,
.files-list__file td:last-child {
  text-align: right;
  font-variant-numeric: tabular-nums;
}

.files-list__file td {
  padding: 0 16px;
  border-top: 1px solid var(--border);
}

.files-list__file td:last-child {
  padding-top: 12px;
  padding-bottom: 12px;
  white-space: nowrap;
}

.files-list__file_low {
  background: var(--red);
}

.files-list__file_medium {
  background: var(--yellow);
}

.files-list__file_high {
  background: var(--green);
}

.files-list__file:hover {
  background: var(--surface-hover);
}

.file-link {
  display: block;
  width: 100%;
  min-height: 44px;
  padding: 12px 0;
  color: var(--color);
  background: transparent;
  border: 0;
  text-align: left;
  cursor: pointer;
  overflow-wrap: anywhere;
}

.file-link::before {
  content: '📄';
  margin-right: 10px;
}

.files-list__file_folder .file-link::before {
  content: '📁';
}

.file-content {
  margin: 16px 0 0;
  padding: 12px 0;
  overflow-x: auto;
  background: var(--surface);
  border-radius: 12px;
  box-shadow: 0 1px 3px #11182718, 0 8px 24px #1118270a;
  font: 0.875rem/1.6 ui-monospace, SFMono-Regular, Consolas, 'Liberation Mono', monospace;
  tab-size: 4;
}

.code-text-container {
  display: grid;
  grid-template-columns: 5ch minmax(max-content, 1fr) 6ch;
  min-width: max-content;
  align-items: start;
}

.line-number {
  padding: 0 12px 0 6px;
  color: var(--muted);
  text-align: right;
  user-select: none;
  font-variant-numeric: tabular-nums;
}

.code-line {
  display: block;
  padding: 0 10px;
  white-space: pre;
  font: inherit;
}

.line-covered {
  background: var(--green);
}

.line-uncovered {
  background: var(--red);
}

.cover-indicator {
  padding: 0 12px 0 4px;
  text-align: right;
  font-weight: 650;
  font-variant-numeric: tabular-nums;
}

@media (max-width: 650px) {
  .app {
    padding: 8px;
  }

  .file-header {
    flex-wrap: wrap;
    gap: 4px 8px;
    padding: 8px;
  }

  .file-header__name {
    flex-basis: calc(100% - 90px);
    font-size: 1rem;
  }

  .file-header__stat {
    order: 3;
    flex-basis: 100%;
    padding-left: 8px;
  }

  .files-list__file td {
    padding-right: 8px;
    padding-left: 8px;
  }
}
</style>
</head>

ruct ApiDoc;\n\n/// What the handlers read. Both come from the view task (`view::run`).\n#[derive(Clone)]\npub struct ApiState {\n    pub view: watch::Receiver\u003cClusterView\u003e,\n    /// Only for `subscribe`: every event stream gets its own receiver.\n    pub events: broadcast::Sender\u003cEvent\u003e,\n}\n\nfn open_api_router() -\u003e OpenApiRouter\u003cApiState\u003e {\n    // `routes!` takes only handlers of the same path.\n    OpenApiRouter::with_openapi(ApiDoc::openapi())\n        .routes(routes!(list_nodes))\n        .routes(routes!(events))\n        .routes(routes!(list_containers))\n        .routes(routes!(put_container, get_container, delete_container))\n}\n\n/// Returns the axum router of the node API.\npub fn router(state: ApiState) -\u003e Router {\n    let (router, _) = open_api_router().split_for_parts();\n    router.with_state(state)\n}\n\n/// Returns the OpenAPI spec of the node API.\npub fn spec() -\u003e utoipa::openapi::OpenApi {\n    let (_, spec) = open_api_router().split_for_parts();\n    spec\n}\n\n/// Serves the node API on `listener`.\n/// Returns only on an error.\npub async fn serve(listener: TcpListener, state: ApiState) -\u003e anyhow::Result\u003c()\u003e {\n    axum::serve(listener, router(state)).await?;\n    Ok(())\n}\n\n/// Returns all nodes of the cluster, as this node sees them.\n#[utoipa::path(\n    get,\n    path = NODES_PATH,\n    tag = \"nodes\",\n    responses((status = 200, description = \"All nodes, in the order of their IDs\", body = Vec\u003cNode\u003e))\n)]\nasync fn list_nodes(State(state): State\u003cApiState\u003e) -\u003e Json\u003cVec\u003cNode\u003e\u003e {\n    let nodes = state.view.borrow().nodes.values().cloned().collect();\n    Json(nodes)\n}\n\n/// Streams the changes of the cluster as server-sent events.\n///\n/// Every event has one JSON `Event` in its `data` field.\n/// The stream starts with a `snapshot`.\n/// A client that reads too slowly gets a new `snapshot` instead of the events that it missed dress":[12441133],"length":1,"stats":{"Line":1}},{"line":213,"address":[12443184,12464128,12443367,12443261,12443281,12443212],"length":1,"stats":{"Line":3}},{"line":214,"address":[12443245],"length":1,"stats":{"Line":1}}],"covered":44,"coverable":46},{"path":["/","home","runner","work","yaco","yaco","crates","yaco-agent","src","api","tests.rs"],"content":"#![cfg(test)]\n\nuse super::*;\n\nuse std::collections::BTreeMap;\n\nuse yaco_api::Liveness;\n\n/// A running API server on 127.0.0.1 with `view`.\n/// Returns its base URL and the senders that the view task has in the agent.\nasync fn start(\n    view: ClusterView,\n    event_buffer: usize,\n) -\u003e (String, watch::Sender\u003cClusterView\u003e, broadcast::Sender\u003cEvent\u003e) {\n    let (view_tx, view_rx) = watch::channel(view);\n    let (events_tx, _) = broadcast::channel(event_buffer);\n    let listener = TcpListener::bind(\"127.0.0.1:0\").await.unwrap();\n    let base = format!(\"http://{}\", listener.local_addr().unwrap());\n    let state = ApiState {\n        view: view_rx,\n        events: events_tx.clone(),\n    };\n    tokio::spawn(serve(listener, state));\n    (base, view_tx, events_tx)\n}\n\nfn client() -\u003e reqwest::Client {\n    reqwest::Client::builder().no_proxy().build().unwrap()\n}\n\nfn node(id: \u0026str, liveness: Liveness) -\u003e Node {\n    Node {\n        id: id.to_string(),\n        generation: 1,\n        liveness,\n        facts: BTreeMap::new(),\n    }\n}\n\n/// The view of n1, which knows n2.\nfn two_nodes() -\u003e ClusterView {\n    let mut view = ClusterView::empty(\"n1\");\n    for node in [node(\"n1\", Liveness::Live), node(\"n2\", Liveness::Dead)] {\n        view.nodes.insert(node.id.clone(), node);\n    }\n    view\n}\n\n/// Reads server-sent events from a response, one at a time.\nstruct EventReader {\n    response: reqwest::Response,\n    buffer: String,\n}\n\nimpl EventReader {\n    async fn next(\u0026mut self) -\u003e Event {\n        loop {\n            // An event ends with an empty line. Keep-alive comments start with ':'.\n            if let Some(end) = self.buffer.find(\"\\n\\n\") {\n                let block: String = self.buffer.drain(..end + 2).collect();\n                let data: String = block\n                    .lines()\n                    .filter_map(|line| line.strip_prefix(\"data: \"))\n                    .collect();\n                if !data.is_empty() {\n                    return serde_json::from_str(\u0026data).unwrap();\n                }\n                continue;\n            }\n            let chunk = self.response.chunk().await.unwrap().expect(\"stream ended\");\n            self.buffer.push_str(std::str::from_utf8(\u0026chunk).unwrap());\n        }\n    }\n}\n\nasync fn read_events(base: \u0026str) -\u003e EventReader {\n    let response = client()\n        .get(format!(\"{base}{EVENTS_PATH}\"))\n        .send()\n        .await\n        .unwrap();\n    assert_eq!(response.status(), StatusCode::OK);\n    assert_eq!(response.headers()[\"content-type\"], \"text/event-stream\");\n    EventReader {\n        response,\n        buffer: String::new(),\n    }\n}\n\nfn spec_json() -\u003e serde_json::Value {\n    serde_json::from_str(\u0026spec().to_json().unwrap()).unwrap()\n}\n\n#[test]\nfn spec_has_every_operation() {\n    let spec = spec();\n    let paths = \u0026spec.paths.paths;\n\n    assert!(paths[NODES_PATH].get.is_some());\n    assert!(paths[EVENTS_PATH].get.is_some());\n    assert!(paths[CONTAINERS_PATH].get.is_some());\n    let one = \u0026paths[CONTAINER_PATH];\n    assert!(one.put.is_some());\n    assert!(one.get.is_some());\n    assert!(one.delete.is_some());\n\n    assert_eq!(paths.len(), 4, \"unexpected paths: {:?}\", paths.keys());\n}\n\n#[test]\nfn write_operations_document_the_sender_header() {\n    let spec = spec_json();\n    for (path, operations) in spec[\"paths\"].as_object().unwrap() {\n        for (method, operation) in operations.as_object().unwrap() {\n            if [\"put\", \"post\", \"delete\"].contains(\u0026method.as_str()) {\n                let parameters = operation[\"parameters\"].as_array().unwrap();\n                let has_sender = parameters\n                    .iter()\n                    .any(|p| p[\"name\"] == yaco_api::SENDER_HEADER \u0026\u0026 p[\"in\"] == \"header\");\n                assert!(has_sender, \"{method} {path} has no sender header\");\n            }\n        }\n    }\n}\n\n#[test]\nfn spec_has_the_schemas_of_the_bodies() {\n    let spec = spec_json();\n    let schemas = spec[\"components\"][\"schemas\"].as_object().unwrap();\n    assert!(schemas.contains_key(\"ContainerManifest\"));\n    assert!(schemas.contains_key(\"ErrorResponse\"));\n    assert!(schemas.contains_key(\"Node\"));\n    assert!(schemas.contains_key(\"Event\"));\n}\n\n#[tokio::test]\nasync fn nodes_are_the_nodes_of_the_view() {\n    let (base, _view, _events) = start(two_nodes(), 16).await;\n    let response = client()\n        .get(format!(\"{base}{NODES_PATH}\"))\n        .send()\n        .await\n        .unwrap();\n    assert_eq!(response.status(), StatusCode::OK);\n    let nodes: Vec\u003cNode\u003e = response.json().await.unwrap();\n    assert_eq!(nodes, two_nodes().nodes.into_values().collect::\u003cVec\u003c_\u003e\u003e());\n}\n\n#[tokio::test]\nasync fn event_stream_starts_with_a_snapshot_then_sends_every_event() {\n    let (base, _view, events) = start(two_nodes(), 16).await;\n    let mut reader = read_events(\u0026base).await;\n\n    assert_eq!(reader.next().await, view::snapshot(\u0026two_nodes()));\n\n    let event = Event::NodeChanged {\n        node: node(\"n2\", Liveness::Live),\n    };\n    events.send(event.clone()).unwrap();\n    assert_eq!(reader.next().await, event);\n}\n\n#[tokio::test]\nasync fn slow_stream_gets_a_new_snapshot_instead_of_the_missed_events() {\n    // The channel keeps only one event, so a reader that misses more lags.\n    let (base, view, events) = start(two_nodes(), 1).await;\n    let mut reader = read_events(\u0026base).await;\n    reader.next().await;\n\n    // Send a bunch of \"missed\" events about removing some nodes\n    for id in [\"n2\", \"n3\", \"n4\"] {\n        events\n            .send(Event::NodeRemoved { id: id.to_string() })\n            .unwrap();\n    }\n    // Force change the view to something testable.\n    let mut changed = two_nodes();\n    changed.nodes.remove(\"n2\");\n    view.send_replace(changed.clone());\n\n    assert_eq!(reader.next().await, view::snapshot(\u0026changed));\n}\n\n#[tokio::test]\nasync fn container_operation_answers_not_implemented() {\n    let (base, _view, _events) = start(two_nodes(), 16).await;\n    let client = client();\n    let one = format!(\"{base}{}\", CONTAINER_PATH.replace(\"{name}\", \"web\"));\n    let requests = [\n        client.get(format!(\"{base}{CONTAINERS_PATH}\")),\n        client.put(\u0026one),\n        client.get(\u0026one),\n        client.delete(\u0026one),\n    ];\n    for request in requests {\n        let response = request.send().await.unwrap();\n        assert_eq!(response.status(), StatusCode::NOT_IMPLEMENTED);\n        let body: ErrorResponse = response.json().await.unwrap();\n        assert_eq!(body.message, \"not implemented yet\");\n    }\n}\n","traces":[],"covered":0,"coverable":0},{"path":["/","home","runner","work","yaco","yaco","crates","yaco-agent","src","config","mod.rs"],"content":"//! Agent configuration, read from one TOML file.\n//!\n//! The file has two tables:\n//!\n//! - `[node]`: values of this node only, for example its ID and public IP.\n//! - `[cluster]`: values that must be the same on every node.\n//!   A joining node sends the fingerprint of its `[cluster]` table,\n//!   and the seed refuses the join if the fingerprint differs from its own.\n//!\n//! Every value except `node.id` and `node.public_ip` has a default.\n//! Unknown keys are errors, so a typo does not silently fall back to a default.\n//! Durations are strings like \"500ms\", \"30s\" or \"24h\".\n//!\n//! The join token is not in the file. It comes from `YACO_TOKEN`.\n\nmod tests;\n\nuse std::fmt;\nuse std::net::{IpAddr, SocketAddr};\nuse std::path::Path;\nuse std::time::Duration;\n\nuse anyhow::Context;\nuse serde::{Deserialize, Serialize};\nuse sha2::{Digest, Sha256};\n\nuse crate::join::{BOOT_CLIENT_IP, BOOT_SERVER_IP};\nuse crate::mesh::MeshSubnet;\n\n/// Linux limits interface names to 15 bytes.\nconst MAX_INTERFACE_NAME_LEN: usize = 15;\n\n#[derive(Clone, Debug, PartialEq, Deserialize, Serialize)]\n#[serde(deny_unknown_fields)]\npub struct Config {\n    pub node: NodeConfig,\n    #[serde(default)]\n    pub cluster: ClusterConfig,\n}\n\n/// Values of this node only. Not part of the cluster fingerprint.\n#[derive(Clone, Debug, PartialEq, Deserialize, Serialize)]\n#[serde(deny_unknown_fields)]\npub struct NodeConfig {\n    /// Unique ID of this node in the cluster.\n    pub id: String,\n    /// Public IP of this node, for both WireGuard endpoints.\n    pub public_ip: IpAddr,\n    /// Public bootstrap addresses (IP and bootstrap port) of existing nodes.\n    /// Empty: the node starts a new cluster.\n    #[serde(default)]\n    pub seeds: Vec\u003cSocketAddr\u003e,\n    /// UDP port of the mesh WireGuard interface.\n    #[serde(default = \"default_mesh_port\")]\n    pub mesh_port: u16,\n    /// UDP port of the bootstrap WireGuard interface.\n    #[serde(default = \"default_boot_port\")]\n    pub boot_port: u16,\n    /// Name of the mesh WireGuard interface.\n    #[serde(default = \"default_mesh_interface\")]\n    pub mesh_interface: String,\n    /// Name of the bootstrap WireGuard interface.\n    #[serde(default = \"default_boot_interface\")]\n    pub boot_interface: String,\n}\n\nfn default_mesh_port() -\u003e u16 {\n    7281\n}\n\nfn default_boot_port() -\u003e u16 {\n    7282\n}\n\nfn default_mesh_interface() -\u003e String {\n    \"yaco-mesh\".to_string()\n}\n\nfn default_boot_interface() -\u003e String {\n    \"yaco-boot\".to_string()\n}\n\n/// Values that must be the same on every node.\n///\n/// Cluster fingerprint is built out of the values of these fields.\n/// Changing the fields changes the fingerprint,\n/// so nodes of the old and the new version cannot join each other.\n#[derive(Clone, Debug, PartialEq, Deserialize, Serialize)]\n#[serde(default, deny_unknown_fields)]\npub struct ClusterConfig {\n    // Mesh.\n    /// Subnet of the mesh IPs.\n    pub mesh_subnet: MeshSubnet,\n    /// MTU of both WireGuard interfaces.\n    pub mtu: u32,\n    /// How often the peer list is synchronized without a membership change.\n    #[serde(with = \"humantime_serde\")]\n    pub peer_resync_interval: Duration,\n\n    // Gossip.\n    /// chitchat ignores messages with another cluster ID.\n    pub cluster_id: String,\n    /// UDP port of chitchat, on the mesh IP.\n    pub gossip_port: u16,\n    #[serde(with = \"humantime_serde\")]\n    pub gossip_interval: Duration,\n    /// Gossip rounds to wait after a node marks itself as leaving,\n    /// so that the mark reaches the other nodes.\n    pub leave_rounds: u32,\n    /// How long chitchat keeps a dead node, and so its WireGuard peer.\n    /// A node that comes back later must restart and join again.\n    #[serde(with = \"humantime_serde\")]\n    pub dead_node_grace_period: Duration,\n    /// How long chitchat keeps deleted keys.\n    #[serde(with = \"humantime_serde\")]\n    pub tombstone_grace_period: Duration,\n    /// Failure detector: phi value above which a node is dead.\n    pub phi_threshold: f64,\n    /// Failure detector: number of heartbeat intervals to keep.\n    pub sampling_window_size: usize,\n    /// Failure detector: a longer heartbeat interval is not sampled.\n    #[serde(with = \"humantime_serde\")]\n    pub max_heartbeat_interval: Duration,\n    /// Failure detector: interval to assume before the first heartbeat.\n    #[serde(with = \"humantime_serde\")]\n    pub initial_heartbeat_interval: Duration,\n\n    // Join.\n    /// TCP port of the join endpoint, inside the bootstrap tunnel.\n    pub join_port: u16,\n    /// Timeout of one join request, WireGuard handshake included.\n    #[serde(with = \"humantime_serde\")]\n    pub join_request_timeout: Duration,\n    /// How often a joining node tries all seeds before it gives up.\n    pub join_rounds: u32,\n    /// Pause between two join rounds.\n    /// A random part of up to the same length is added,\n    /// so that two nodes that join through the same seed do not collide again.\n    #[serde(with = \"humantime_serde\")]\n    pub join_retry_delay: Duration,\n    /// How many mesh IPs a joining node proposes to one seed before it gives up.\n    pub max_mesh_ip_attempts: u32,\n\n    // Node API.\n    /// TCP port of the node API, on the mesh IP.\n    /// The same on every node, so that a node can forward a request to another node.\n    pub api_port: u16,\n}\n\nimpl Default for ClusterConfig {\n    fn default() -\u003e Self {\n        ClusterConfig {\n            mesh_subnet: \"10.42.0.0/16\".parse().unwrap(),\n            mtu: 1420,\n            peer_resync_interval: Duration::from_secs(30),\n\n            cluster_id: \"yaco\".to_string(),\n            gossip_port: 7280,\n            gossip_interval: Duration::from_secs(1),\n            leave_rounds: 3,\n            dead_node_grace_period: Duration::from_secs(24 * 60 * 60),\n            tombstone_grace_period: Duration::from_secs(60 * 60),\n            // The chitchat defaults.\n            phi_threshold: 8.0,\n            sampling_window_size: 1000,\n            max_heartbeat_interval: Duration::from_secs(10),\n            initial_heartbeat_interval: Duration::from_secs(5),\n\n            join_port: 7283,\n            join_request_timeout: Duration::from_secs(5),\n            join_rounds: 5,\n            join_retry_delay: Duration::from_secs(5),\n            max_mesh_ip_attempts: 16,\n\n            api_port: 7284,\n        }\n    }\n}\n\nimpl Config {\n    /// Reads, parses and validates the config file.\n    pub fn load(path: \u0026Path) -\u003e anyhow::Result\u003cConfig\u003e {\n        let text = std::fs::read_to_string(path)\n            .with_context(|| format!(\"cannot read config file {}\", path.display()))?;\n        Config::parse(\u0026text).with_context(|| format!(\"bad config file {}\", path.display()))\n    }\n\n    /// Parses and validates the text of a config file.\n    pub fn parse(text: \u0026str) -\u003e anyhow::Result\u003cConfig\u003e {\n        let config: Config = toml::from_str(text)?;\n        config.validate()?;\n        Ok(config)\n    }\n\n    fn validate(\u0026self) -\u003e anyhow::Result\u003c()\u003e {\n        let node = \u0026self.node;\n        let cluster = \u0026self.cluster;\n\n        anyhow::ensure!(!node.id.is_empty(), \"node.id is empty\");\n        for (key, name) in [\n            (\"node.mesh_interface\", \u0026node.mesh_interface),\n            (\"node.boot_interface\", \u0026node.boot_interface),\n        ] {\n            anyhow::ensure!(\n                !name.is_empty() \u0026\u0026 name.len() \u003c= MAX_INTERFACE_NAME_LEN,\n                \"{key} must have 1 to {MAX_INTERFACE_NAME_LEN} characters\"\n            );\n        }\n        anyhow::ensure!(\n            node.mesh_interface != node.boot_interface,\n            \"node.mesh_interface and node.boot_interface are the same\"\n        );\n\n        // `MeshSubnet` checks its own size and host bits when it is parsed.\n        // A mesh node must never get a bootstrap address.\n        let mesh_subnet = cluster.mesh_subnet;\n        anyhow::ensure!(\n            !mesh_subnet.is_host(BOOT_SERVER_IP) \u0026\u0026 !mesh_subnet.is_host(BOOT_CLIENT_IP),\n            \"cluster.mesh_subnet {mesh_subnet} contains the bootstrap addresses \\\n             {BOOT_SERVER_IP} and {BOOT_CLIENT_IP}\"\n        );\n\n        anyhow::ensure!(\n            !cluster.cluster_id.is_empty(),\n            \"cluster.cluster_id is empty\"\n        );\n        anyhow::ensure!(\n            !cluster.gossip_interval.is_zero(),\n            \"cluster.gossip_interval must be more than zero\"\n        );\n        anyhow::ensure!(\n            cluster.join_rounds \u003e 0,\n            \"cluster.join_rounds must be more than zero\"\n        );\n        anyhow::ensure!(\n            cluster.max_mesh_ip_attempts \u003e 0,\n            \"cluster.max_mesh_ip_attempts must be more than zero\"\n        );\n        Ok(())\n    }\n}\n\n/// Fingerprint of a `[cluster]` table: SHA-256 over its values, as lowercase hex.\n/// Two nodes can join each other only if their fingerprints are equal.\n#[derive(Clone, Debug, PartialEq, Eq, Serialize, Deserialize)]\n#[serde(transparent)]\npub struct ConfigFingerprint(String);\n\nimpl fmt::Display for ConfigFingerprint {\n    fn fmt(\u0026self, f: \u0026mut fmt::Formatter) -\u003e fmt::Result {\n        f.write_str(\u0026self.0)\n    }\n}\n\nimpl ClusterConfig {\n    /// Returns the fingerprint of the values, not of the file text,\n    /// so comments, blank lines and the order of keys do not change it.\n    ///\n    /// This is not `std::hash::Hash` on purpose:\n    /// the std docs say that the data `Hash` gives to a hasher is not portable\n    /// across platforms (endianness, type sizes) or stable across compiler versions.\n    /// Nodes built for other CPUs or with other compilers must get the same fingerprint.\n    /// Also, serde visits every field, so a new field cannot be forgotten.\n    pub fn fingerprint(\u0026self) -\u003e ConfigFingerprint {\n        // serde_json writes the fields in declaration order, so the bytes are stable.\n        let json = serde_json::to_vec(self).expect(\"a cluster config always serializes\");\n        let hex = Sha256::digest(\u0026json)\n            .iter()\n            .map(|byte| format!(\"{byte:02x}\"))\n            .collect();\n        ConfigFingerprint(hex)\n    }\n}\n","traces":[{"line":75,"address":[14199872],"length":1,"stats":{"Line":1}},{"line":76,"address":[12085208],"length":1,"stats":{"Line":1}},{"   assert_eq!(config.node.mesh_interface, default_mesh_interface());\n    assert_eq!(config.node.boot_interface, default_boot_interface());\n    assert_eq!(config.cluster, ClusterConfig::default());\n}\n\n#[test]\nfn example_file_is_valid_and_shows_the_defaults() {\n    let text = EXAMPLE;\n    let config = Config::parse(text).unwrap();\n    assert_eq!(config.cluster, ClusterConfig::default());\n    assert_eq!(config.node.mesh_port, default_mesh_port());\n    assert_eq!(config.node.boot_port, default_boot_port());\n    assert_eq!(config.node.mesh_interface, default_mesh_interface());\n    assert_eq!(config.node.boot_interface, default_boot_interface());\n}\n\n#[test]\nfn values_are_read_from_the_file() {\n    let text = r#\"\n[node]\nid = \"node-2\"\npublic_ip = \"192.0.2.2\"\nseeds = [\"192.0.2.1:7282\", \"192.0.2.3:9000\"]\nmesh_port = 9001\n\n[cluster]\nmesh_subnet = \"192.168.0.0/24\"\ngossip_interval = \"250ms\"\n\"#;\n    let config = Config::parse(text).unwrap();\n    assert_eq!(\n        config.node.seeds,\n        vec![\n            \"192.0.2.1:7282\".parse::\u003cSocketAddr\u003e().unwrap(),\n            \"192.0.2.3:9000\".parse().unwrap()\n        ]\n    );\n    assert_eq!(config.node.mesh_port, 9001);\n    assert_eq!(\n        config.cluster.mesh_subnet,\n        \"192.168.0.0/24\".parse().unwrap()\n    );\n    assert_eq!(config.cluster.gossip_interval, Duration::from_millis(250));\n}\n\n#[test]\nfn required_node_values_are_required() {\n    assert!(Config::parse(\"[node]\\nid = \\\"node-1\\\"\\n\").is_err());\n    assert!(Config::parse(\"[node]\\npublic_ip = \\\"192.0.2.1\\\"\\n\").is_err());\n    assert!(Config::parse(\"\").is_err());\n}\n\n#[test]\nfn unknown_keys_are_errors() {\n    assert!(Config::parse(\u0026format!(\"{MINIMAL}typo = 1\\n\")).is_err());\n    assert!(Config::parse(\u0026with_cluster_line(\"gossip_intervall = \\\"1s\\\"\")).is_err());\n    assert!(Config::parse(\u0026format!(\"{MINIMAL}\\n[extra]\\n\")).is_err());\n}\n\n#[test]\nfn invalid_values_are_errors() {\n    let bad_cluster_lines = [\n        // Host bits set.\n        \"mesh_subnet = \\\"10.42.1.0/16\\\"\",\n        // Too small for the addresses that the agent needs.\n        \"mesh_subnet = \\\"10.42.0.0/31\\\"\",\n        // Contains the fixed bootstrap addresses.\n        \"mesh_subnet = \\\"169.254.0.0/16\\\"\",\n        \"mesh_subnet = \\\"169.254.42.0/30\\\"\",\n        // No longer configurable.\n        \"boot_subnet = \\\"169.254.42.0/30\\\"\",\n        \"gossip_interval = \\\"0s\\\"\",\n        \"join_rounds = 0\",\n        \"max_mesh_ip_attempts = 0\",\n        \"cluster_id = \\\"\\\"\",\n        \"gossip_interval = \\\"soon\\\"\",\n    ];\n    for line in bad_cluster_lines {\n        assert!(\n            Config::parse(\u0026with_cluster_line(line)).is_err(),\n            \"accepted: {line}\"\n        );\n    }\n\n    let bad_node_lines = [\n        \"mesh_interface = \\\"a-name-that-is-too-long\\\"\",\n        \"boot_interface = \\\"\\\"\",\n        \"boot_interface = \\\"yaco-mesh\\\"\",\n    ];\n    for line in bad_node_lines {\n        let text = MINIMAL.replace(\"[node]\", \u0026format!(\"[node]\\n{line}\"));\n        assert!(Config::parse(\u0026text).is_err(), \"accepted: {line}\");\n    }\n    assert!(Config::parse(\u0026MINIMAL.replace(\"\\\"node-1\\\"\", \"\\\"\\\"\")).is_err());\n}\n\n#[test]\nfn fingerprint_ignores_formatting_and_key_order() {\n    let a = Config::parse(\u0026with_cluster_line(\"gossip_interval = \\\"2s\\\"\\nmtu = 1400\")).unwrap();\n    let b = Config::parse(\u0026with_cluster_line(\n        \"# a comment\\nmtu    =   1400\\n\\ngossip_interval = \\\"2000ms\\\"\",\n    ))\n    .unwrap();\n    assert_eq!(a.cluster.fingerprint(), b.cluster.fingerprint());\n}\n\n#[test]\nfn fingerprint_changes_with_any_cluster_value() {\n    let base = ClusterConfig::default().fingerprint();\n    let changed_lines = [\n        \"mesh_subnet = \\\"10.43.0.0/16\\\"\",\n        \"mtu = 1400\",\n        \"peer_resync_interval = \\\"31s\\\"\",\n        \"cluster_id = \\\"other\\\"\",\n        \"gossip_port = 7290\",\n        \"phi_threshold = 9.0\",\n        \"join_port = 7293\",\n        \"max_mesh_ip_attempts = 17\",\n        \"api_port = 7294\",\n    ];\n    for line in changed_lines {\n        let config = Config::parse(\u0026with_cluster_line(line)).unwrap();\n        assert_ne!(\n            config.cluster.fingerprint(),\n            base,\n            \"same fingerprint with: {line}\"\n        );\n    }\n}\n\n#[test]\nfn fingerprint_does_not_depend_on_node_values() {\n    let a = Config::parse(MINIMAL).unwrap();\n    let text = r#\"\n[node]\nid = \"node-9\"\npublic_ip = \"198.51.100.9\"\nseeds = [\"192.0.2.1:7282\"]\nmesh_port = 9001\n\"#;\n    let b = Config::parse(text).unwrap();\n    assert_eq!(a.cluster.fingerprint(), b.cluster.fingerprint());\n}\n\n/// Collects the dotted paths of all keys in `value`, for example `cluster.mtu`.\n/// Arrays are values, so their items are not keys.\nfn key_paths(value: \u0026toml::Value, prefix: \u0026str, paths: \u0026mut Vec\u003cString\u003e) {\n    if let toml::Value::Table(table) = value {\n        for (key, value) in table {\n            let path = if prefix.is_empty() {\n                key.clone()\n            } else {\n                format!(\"{prefix}.{key}\")\n            };\n            key_paths(value, \u0026path, paths);\n            if !value.is_table() {\n                paths.push(path);\n            }\n        }\n    }\n    paths.sort();\n}\n\n#[test]\nfn example_file_shows_every_config_key() {\n    // All keys that `Config` has, from a serialized config.\n    let config = toml::Value::try_from(Config::parse(MINIMAL).unwrap()).unwrap();\n    let mut expected = Vec::new();\n    key_paths(\u0026config, \"\", \u0026mut expected);\n\n    let example: toml::Value = toml::from_str(EXAMPLE).unwrap();\n    let mut shown = Vec::new();\n    key_paths(\u0026example, \"\", \u0026mut shown);\n\n    // Unknown keys in the example already fail `example_file_is_valid_and_shows_the_defaults`.\n    let missing: Vec\u003c\u0026String\u003e = expected.iter().filter(|key| !shown.contains(key)).collect();\n    assert!(\n        missing.is_empty(),\n        \"yaco.example.toml does not show these config keys: {missing:?}\"\n    );\n}\n\n#[test]\nfn load_reads_the_file() {\n    let mut file = tempfile::NamedTempFile::new().unwrap();\n    std::io::Write::write_all(\u0026mut file, MINIMAL.as_bytes()).unwrap();\n    let config = Config::load(file.path()).unwrap();\n    assert_eq!(config.node.id, \"node-1\");\n}\n\n#[test]\nfn load_errors_name_the_file() {\n    let missing = std::path::Path::new(\"/nonexistent/yaco.toml\");\n    let err = Config::load(missing).unwrap_err();\n    assert!(\n        format!(\"{err:#}\").contains(\"/nonexistent/yaco.toml\"),\n        \"{err:#}\"\n    );\n\n    let mut file = tempfile::NamedTempFile::new().unwrap();\n    std::io::Write::write_all(\u0026mut file, b\"[node]\\nid = 1\\n\").unwrap();\n    let err = Config::load(file.path()).unwrap_err();\n    let path = file.path().display().to_string();\n    assert!(format!(\"{err:#}\").contains(\u0026path), \"{err:#}\");\n}\n\n#[test]\nfn fingerprint_is_shown_as_64_lowercase_hex_characters() {\n    let shown = ClusterConfig::default().fingerprint().to_string();\n    assert_eq!(shown.len(), 64);\n    assert!(\n        shown\n            .chars()\n            .all(|c| c.is_ascii_digit() || ('a'..='f').contains(\u0026c)),\n        \"{shown}\"\n    );\n}\n","traces":[],"covered":0,"coverable":0},{"path":["/","home","runner","work","yaco","yaco","crates","yaco-agent","src","gossip.rs"],"content":"//! Membership and state replication with chitchat.\n//!\n//! The agent runs chitchat on its mesh IP only,\n//! so gossip is encrypted and only nodes with the join token take part.\n\nuse std::net::SocketAddr;\nuse std::time::{SystemTime, UNIX_EPOCH};\n\nuse chitchat::transport::UdpTransport;\nuse chitchat::{\n    ChitchatConfig, ChitchatHandle, ChitchatId, FailureDetectorConfig, ProtocolVersion,\n    spawn_chitchat,\n};\n\nuse crate::config::ClusterConfig;\n\n/// A node sets this key just before it shuts down.\n/// Other nodes then remove it from the live set at once,\n/// instead of after the failure detector timeout.\npub const LEAVING_KEY: \u0026str = \"leaving\";\n\n/// Builds a chitchat config from the cluster config.\n///\n/// `seeds` are gossip addresses of other nodes.\n/// An empty list starts a new cluster.\npub fn config(\n    node_id: \u0026str,\n    listen_addr: SocketAddr,\n    seeds: \u0026[SocketAddr],\n    cluster: \u0026ClusterConfig,\n) -\u003e ChitchatConfig {\n    ChitchatConfig {\n        chitchat_id: ChitchatId::new(node_id, generation_id(), listen_addr),\n        cluster_id: cluster.cluster_id.clone(),\n        gossip_interval: cluster.gossip_interval,\n        listen_addr,\n        seed_nodes: seeds.iter().map(|addr| addr.to_string()).collect(),\n        failure_detector_config: FailureDetectorConfig {\n            phi_threshold: cluster.phi_threshold,\n            sampling_window_size: cluster.sampling_window_size,\n            max_interval: cluster.max_heartbeat_interval,\n            initial_interval: cluster.initial_heartbeat_interval,\n            // chitchat keeps a dead node this long, and so its WireGuard peer,\n            // so that a node cut off by the network can come back without a restart.\n            // After this, the node must restart and join again.\n            dead_node_grace_period: cluster.dead_node_grace_period,\n        },\n        marked_for_deletion_grace_period: cluster.tombstone_grace_period,\n        catchup_callback: None,\n        extra_liveness_predicate: Some(Box::new(|node_state| {\n            node_state.get(LEAVING_KEY).is_none()\n        })),\n        // Every node is new, so all nodes understand V1.\n        protocol_version: ProtocolVersion::V1,\n    }\n}\n\n/// Starts chitchat in a background tokio task.\n/// `key_values` are published in the own namespace from the start.\npub async fn start(\n    config: ChitchatConfig,\n    key_values: Vec\u003c(String, String)\u003e,\n) -\u003e anyhow::Result\u003cChitchatHandle\u003e {\n    spawn_chitchat(config, key_values, \u0026UdpTransport).await\n}\n\n/// Leaves the cluster gracefully and stops chitchat.\n/// Waits `leave_rounds` gossip rounds, so that `LEAVING_KEY` reaches the other nodes.\npub async fn leave(handle: ChitchatHandle, cluster: \u0026ClusterConfig) -\u003e anyhow::Result\u003c()\u003e {\n    handle\n        .with_chitchat(|chitchat| chitchat.self_node_state().set(LEAVING_KEY, \"true\"))\n        .await;\n    tokio::time::sleep(cluster.gossip_interval * cluster.leave_rounds).await;\n    handle.shutdown().await\n}\n\n/// Returns the sorted node IDs of all live nodes, self included.\n///\n/// Reads the live-nodes watcher, not `Chitchat::live_nodes()`,\n/// because only the watcher applies `extra_liveness_predicate`.\n/// The watcher is updated once per gossip round.\npub async fn live_node_ids(handle: \u0026ChitchatHandle) -\u003e Vec\u003cString\u003e {\n    let watcher = handle.chitchat().lock().await.live_nodes_watcher();\n    watcher\n        .borrow()\n        .keys()\n        .map(|id| id.node_id.to_string())\n        .collect()\n}\n\n/// chitchat uses the generation ID to detect a restarted node.\n/// It must increase on every start,\n/// so use the start time, as chitchat recommends.\nfn generation_id() -\u003e u64 {\n    SystemTime::now()\n        .duration_since(UNIX_EPOCH)\n        .map(|d| d.as_secs())\n        .unwrap_or(0)\n}\n","traces":[{"line":26,"address":[14940359,14940387,14939488],"length":1,"stats":{"Line":4}},{"line":33,"address":[13225354],"length":1,"stats":{"Line":5}},{"line":34,"address":[13225433],"length":1,"stats":{"Line":4}},{"line":35,"address":[14939738],"length":1,"stats":{"Line":4}},{"line":37,"address":[13225602,13225530,13205200,13205235],"length":1,"stats":{"Line":11}},{"line":38,"address":[13846001],"lengt g the join:\n//!   the key is `boot_client`,\n//!   and the only peer is the seed, with the `boot_server` public key.\n//!\n//! After the join, the joining node reconfigures the same interface to the server role,\n//! so it can be a seed for other nodes.\n\nmod tests;\n\nuse std::net::{IpAddr, Ipv4Addr, SocketAddr};\nuse std::sync::Arc;\nuse std::time::Duration;\n\nuse anyhow::Context;\nuse axum::extract::State;\nuse axum::http::StatusCode;\nuse axum::routing::post;\nuse axum::{Json, Router};\nuse defguard_wireguard_rs::key::Key;\nuse defguard_wireguard_rs::net::IpAddrMask;\nuse defguard_wireguard_rs::peer::Peer;\nuse defguard_wireguard_rs::{InterfaceConfiguration, Kernel, WGApi, WireguardInterfaceApi};\nuse serde::{Deserialize, Serialize};\nuse tokio::sync::{mpsc, watch};\n\nuse crate::config::{ClusterConfig, Config, ConfigFingerprint};\nuse crate::keys::ClusterKeys;\nuse crate::mesh::MeshPeer;\n\n/// Addresses inside the bootstrap tunnel. They are not configurable.\n/// They are link-local, so they are never routed,\n/// and a /30 has room for exactly these two hosts.\n/// Every member has the same server address which don't conflict\n/// because each member has its own tunnel to the joining node.\npub const BOOT_SERVER_IP: Ipv4Addr = Ipv4Addr::new(169, 254, 42, 1);\npub const BOOT_CLIENT_IP: Ipv4Addr = Ipv4Addr::new(169, 254, 42, 2);\npub const BOOT_PREFIX_LEN: u8 = 30;\n\n#[derive(Clone, Debug, PartialEq, Eq, Serialize, Deserialize)]\npub struct JoinRequest {\n    /// `[cluster]` config fingerprint of the joining node.\n    /// The seed refuses the join if it differs from its own.\n    pub config_fingerprint: ConfigFingerprint,\n    /// The node ID, the main WireGuard key, the proposed mesh IP and the public endpoint.\n    pub peer: MeshPeer,\n}\n\n#[derive(Clone, Debug, PartialEq, Eq, Serialize, Deserialize)]\npub struct JoinResponse {\n    /// The seed and all its peers: the nodes that it knows, live or dead,\n    /// and the nodes that joined but are not in gossip yet.\n    pub members: Vec\u003cMeshPeer\u003e,\n    /// Gossip address of the seed, inside the mesh.\n    pub gossip_seed: SocketAddr,\n}\n\n#[derive(Debug, PartialEq, Eq)]\npub enum JoinRefusal {\n    /// The request is malformed. HTTP 400.\n    BadRequest(String),\n    /// The `[cluster]` config of the joining node differs from the seed's. HTTP 400.\n    ConfigMismatch,\n    /// Another node has the proposed mesh IP. HTTP 409.\n    MeshIpInUse,\n}\n\n/// Checks a join request against the config and the peers of the seed.\n/// `own` is the seed. `peers` are all current peers from `mesh::sync_peers`.\n///\n/// Returns the members for the join response:\n/// the seed and its peers, without earlier generations of the joining node.\npub fn check_join(\n    request: \u0026JoinRequest,\n    cluster: \u0026ClusterConfig,\n    own: \u0026MeshPeer,\n    peers: \u0026[MeshPeer],\n) -\u003e Result\u003cVec\u003cMeshPeer\u003e, JoinRefusal\u003e {\n    if request.config_fingerprint != cluster.fingerprint() {\n        return Err(JoinRefusal::ConfigMismatch);\n    }\n    if request.peer.node_id.is_empty() {\n        return Err(JoinRefusal::BadRequest(\"empty node_id\".to_string()));\n    }\n    if !cluster.mesh_subnet.is_host(request.peer.mesh_ip) {\n        return Err(JoinRefusal::BadRequest(format!(\n            \"{} is not in the mesh subnet\",\n            request.peer.mesh_ip\n        )));\n    }\n\n    // An earlier generation of the joining node gives its mesh IP free.\n    // So does a retried request of the same node.\n    let mut members = vec![own.clone()];\n    members.extend(\n        peers\n            .iter()\n            .filter(|peer| peer.node_id != request.peer.node_id)\n            .cloned(),\n    );\n    if members.iter().any(|m| m.mesh_ip == request.peer.mesh_ip) {\n        return Err(JoinRefusal::MeshIpInUse);\n    }\n    Ok(members)\n}\n\n/// The bootstrap interface of this node.\npub struct Bootstrap {\n    api: WGApi\u003cKernel\u003e,\n    interface: String,\n    port: u16,\n    cluster: ClusterConfig,\n}\n\nimpl Bootstrap {\n    /// Creates the bootstrap interface, or reuses a leftover one.\n    /// Call `set_client` or `set_server` next.\n    pub fn create(config: \u0026Config) -\u003e anyhow::Result\u003cBootstrap\u003e {\n        let interface = config.node.boot_interface.clone();\n        let mut api = WGApi::\u003cKernel\u003e::new(interface.clone())?;\n        api.create_interface()\n            .with_context(|| format!(\"cannot create interface {interface}\"))?;\n        Ok(Bootstrap {\n            api,\n            interface,\n            port: config.node.boot_port,\n            cluster: config.cluster.clone(),\n        })\n    }\n\n    /// Client role: the only peer is the seed at `seed`.\n    pub fn set_client(\u0026self, keys: \u0026ClusterKeys, seed: SocketAddr) -\u003e anyhow::Result\u003c()\u003e {\n        let mut server = Peer::new(keys.boot_server.public_key());\n        server.endpoint = Some(seed);\n        server.allowed_ips = vec![IpAddrMask::host(IpAddr::V4(BOOT_SERVER_IP))];\n        self.configure(\u0026keys.boot_client, BOOT_CLIENT_IP, server)\n    }\n\n    /// Server role: the only peer is any joining node.\n    pub fn set_server(\u0026self, keys: \u0026ClusterKeys) -\u003e anyhow::Result\u003c()\u003e {\n        let mut client = Peer::new(keys.boot_client.public_key());\n        client.allowed_ips = vec![IpAddrMask::host(IpAddr::V4(BOOT_CLIENT_IP))];\n        self.configure(\u0026keys.boot_server, BOOT_SERVER_IP, client)\n    }\n\n    /// Replaces the key, the address and the peers of the interface.\n    fn configure(\u0026self, private_key: \u0026Key, ip: Ipv4Addr, peer: Peer) -\u003e anyhow::Result\u003c()\u003e {\n        self.api\n            .configure_interface(\u0026InterfaceConfiguration {\n                name: self.interface.clone(),\n                prvkey: private_key.to_string(),\n                // The subnet prefix gives the kernel a route to the other end of the tunnel.\n                addresses: vec![IpAddrMask::new(IpAddr::V4(ip), BOOT_PREFIX_LEN)],\n                port: self.port,\n                peers: vec![peer],\n                mtu: Some(self.cluster.mtu),\n                fwmark: None,\n            })\n            .with_context(|| format!(\"cannot configure interface {}\", self.interface))\n    }\n}\n\n/// Shared state of the join endpoint.\npub struct JoinServer {\n    config: Config,\n    /// Facts of this node.\n    own: MeshPeer,\n    /// Gossip address of this node, inside the mesh.\n    gossip_addr: SocketAddr,\n    /// Sends the peer of every accepted node to `mesh::sync_peers`.\n    new_peers: mpsc::UnboundedSender\u003cMeshPeer\u003e,\n    /// All peers of this node, from `mesh::sync_peers`.\n    peers: watch::Receiver\u003cVec\u003cMeshPeer\u003e\u003e,\n}\n\nimpl JoinServer {\n    pub fn new(\n        config: Config,\n        own: MeshPeer,\n        gossip_addr: SocketAddr,\n        new_peers: mpsc::UnboundedSender\u003cMeshPeer\u003e,\n        peers: watch::Receiver\u003cVec\u003cMeshPeer\u003e\u003e,\n    ) -\u003e JoinServer {\n        JoinServer {\n            config,\n            own,\n            gossip_addr,\n            new_peers,\n            peers,\n        }\n    }\n}\n\n/// Serves `POST /join` on the bootstrap interface only.\n/// Call it after `Bootstrap::set_server`, when the server address exists.\npub async fn serve(server: JoinServer) -\u003e anyhow::Result\u003c()\u003e {\n    let socket = tokio::net::TcpSocket::new_v4()?;\n    // Without this, the kernel also accepts connections to the server address\n    // that arrive on another interface, outside the tunnel.\n    socket.bind_device(Some(server.config.node.boot_interface.as_bytes()))?;\n    socket.set_reuseaddr(true)?;\n    let cluster = \u0026server.config.cluster;\n    socket\n        .bind(SocketAddr::new(\n            IpAddr::V4(BOOT_SERVER_IP),\n            cluster.join_port,\n        ))\n        .context(\"cannot bind the join endpoint\")?;\n    let listener = socket.listen(16)?;\n\n    let app = Router::new()\n        .route(\"/join\", post(handle_join))\n        .with_state(Arc::new(server));\n    axum::serve(listener, app).await?;\n    Ok(())\n}\n\nasync fn handle_join(\n    State(server): State\u003cArc\u003cJoinServer\u003e\u003e,\n    Json(request): Json\u003cJoinRequest\u003e,\n) -\u003e Result\u003cJson\u003cJoinResponse\u003e, (StatusCode, String)\u003e {\n    let node_id = \u0026request.peer.node_id;\n    let peers = server.peers.borrow().clone();\n\n    match check_join(\u0026request, \u0026server.config.cluster, \u0026server.own, \u0026peers) {\n        Ok(members) =\u003e {\n            tracing::info!(%node_id, mesh_ip = %request.peer.mesh_ip, endpoint = %request.peer.endpoint, \"accepted join\");\n            // Add the new node as a mesh peer now, not after gossip.\n            if server.new_peers.send(request.peer.clone()).is_err() {\n                tracing::error!(%node_id, \"cannot add the mesh peer: peer sync stopped\");\n                return Err((\n                    StatusCode::SERVICE_UNAVAILABLE,\n                    \"peer sync stopped\".to_string(),\n                ));\n            }\n            Ok(Json(JoinResponse {\n                members,\n                gossip_seed: server.gossip_addr,\n            }))\n        }\n        Err(JoinRefusal::ConfigMismatch) =\u003e {\n            let reason = format!(\n                \"the [cluster] config differs: the seed has fingerprint {}, the joining node has fingerprint {}\",\n                server.config.cluster.fingerprint(),\n                request.config_fingerprint\n            );\n            tracing::warn!(%node_id, \"refused join: {reason}\");\n            Err((StatusCode::BAD_REQUEST, reason))\n        }\n        Err(JoinRefusal::BadRequest(reason)) =\u003e {\n            tracing::warn!(%node_id, \"refused join: {reason}\");\n            Err((StatusCode::BAD_REQUEST, reason))\n        }\n        Err(JoinRefusal::MeshIpInUse) =\u003e {\n            tracing::info!(%node_id, mesh_ip = %request.peer.mesh_ip, \"refused join: mesh IP in use\");\n            Err((StatusCode::CONFLICT, \"mesh IP in use\".to_string()))\n        }\n    }\n}\n\n/// Joins the cluster through one of the seeds in `node.seeds`.\n///\n/// The seeds are public bootstrap endpoints (IP and bootstrap port) of members.\n/// Proposes `mesh_subnet.mesh_ip(node.id, attempt)` and takes the next attempt on HTTP 409.\n/// Returns the accepted facts of this node and the join response.\npub async fn join(\n    boot: \u0026Bootstrap,\n    keys: \u0026ClusterKeys,\n    config: \u0026Config,\n    public_key: \u0026Key,\n) -\u003e anyhow::Result\u003c(MeshPeer, JoinResponse)\u003e {\n    let cluster = \u0026config.cluster;\n    let config_fingerprint = cluster.fingerprint();\n    let client = reqwest::Client::builder()\n        .timeout(cluster.join_request_timeout)\n        // So that we don't proxy join requests through an unrelated proxy.\n        .no_proxy()\n        .build()?;\n    let url = format!(\"http://{BOOT_SERVER_IP}:{}/join\", cluster.join_port);\n\n    for round in 0..cluster.join_rounds {\n        if round \u003e 0 {\n            tokio::time::sleep(with_jitter(cluster.join_retry_delay)).await;\n        }\n        for \u0026seed in \u0026config.node.seeds {\n            boot.set_client(keys, seed)?;\n            let mut attempt = 0;\n            while attempt \u003c cluster.max_mesh_ip_attempts {\n                let peer = MeshPeer::own(config, public_key, attempt);\n                let request = JoinRequest {\n                    config_fingerprint: config_fingerprint.clone(),\n                    peer: peer.clone(),\n                };\n                let result = client.post(\u0026url).json(\u0026request).send().await;\n                match result {\n                    Ok(response) if response.status() == StatusCode::CONFLICT =\u003e {\n                        tracing::info!(%seed, mesh_ip = %peer.mesh_ip, \"mesh IP in use, trying the next one\");\n                        attempt += 1;\n                    }\n                    Ok(response) if response.status().is_success() =\u003e {\n                        let response: JoinResponse = response\n                            .json()\n                            .await\n                            .context(\"bad join response from the seed\")?;\n                        tracing::info!(%seed, mesh_ip = %peer.mesh_ip, members = response.members.len(), \"joined the cluster\");\n                        return Ok((peer, response));\n                    }\n                    Ok(response) =\u003e {\n                        let status = response.status();\n                        let body = response.text().await.unwrap_or_default();\n                        tracing::warn!(%seed, %status, \"seed refused the join: {body}\");\n                        break;\n                    }\n                    Err(err) =\u003e {\n                        let err = anyhow::Error::from(err);\n                        tracing::warn!(%seed, \"cannot reach the seed: {err:#}\");\n                        break;\n                    }\n                }\n            }\n        }\n    }\n    anyhow::bail!(\"cannot join through any seed. Check the seed addresses and the join token\")\n}\n\n/// Returns `delay` plus a random part of up to `delay`.\n///\n/// All joining nodes share one bootstrap client key,\n/// so a seed sees two nodes that join at the same moment as one WireGuard peer,\n/// and at least one of the two requests times out.\n/// Without the random part, both nodes would retry at the same moment and collide again.\npub fn with_jitter(delay: Duration) -\u003e Duration {\n    delay + delay.mul_f64(rand::random::\u003cf64\u003e())\n}\n","traces":[{"line":80,"address":[13327664,13329157,13329163],"length":1,"stats":{"Line":1}},{"line":86,"address":[13327754,13327905],"length":1,"stats":{"Line":2}},{"line":87,"address":[15042 40],"length":1,"stats":{"Line":0}},{"line":322,"address":[15018955,15024227],"length":1,"stats":{"Line":0}},{"line":323,"address":[13310485,13310090,13310011],"length":1,"stats":{"Line":0}},{"line":330,"address":[13303094],"length":1,"stats":{"Line":0}},{"line":339,"address":[13329264],"length":1,"stats":{"Line":1}},{"line":340,"address":[13329285],"length":1,"stats":{"Line":1}}],"covered":40,"coverable":117},{"path":["/","home","runner","work","yaco","yaco","crates","yaco-agent","src","join","tests.rs"],"content":"#![cfg(test)]\n\nuse super::*;\n\n// Not real keys: base64 of 32 bytes of 0x11, 0x22, 0x33, 0x44 and 0x55.\n// Node `node-N` has key `KEY_NODE_N` and mesh IP 10.42.0.N.\nconst KEY_NODE_1: \u0026str = \"ERERERERERERERERERERERERERERERERERERERERERE=\";\nconst KEY_NODE_2: \u0026str = \"IiIiIiIiIiIiIiIiIiIiIiIiIiIiIiIiIiIiIiIiIiI=\";\nconst KEY_NODE_3: \u0026str = \"MzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzM=\";\nconst KEY_NODE_4: \u0026str = \"REREREREREREREREREREREREREREREREREREREREREQ=\";\n/// The new key of `node-2` after a restart.\nconst KEY_NODE_2_RESTARTED: \u0026str = \"VVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVU=\";\n\nfn peer(node_id: \u0026str, public_key: \u0026str, mesh_ip: [u8; 4]) -\u003e MeshPeer {\n    MeshPeer {\n        node_id: node_id.to_string(),\n        public_key: Key::try_from(public_key).unwrap(),\n        mesh_ip: Ipv4Addr::from(mesh_ip),\n        endpoint: \"192.0.2.1:7281\".parse().unwrap(),\n    }\n}\n\n/// The mesh subnet is set here, not taken from the default of the config,\n/// so a change of the default does not break the tests.\nfn cluster() -\u003e ClusterConfig {\n    ClusterConfig {\n        mesh_subnet: \"10.42.0.0/16\".parse().unwrap(),\n        ..ClusterConfig::default()\n    }\n}\n\n/// A join request of `node_id` with the config of `cluster()`.\nfn request(node_id: \u0026str, public_key: \u0026str, mesh_ip: [u8; 4]) -\u003e JoinRequest {\n    JoinRequest {\n        config_fingerprint: cluster().fingerprint(),\n        peer: peer(node_id, public_key, mesh_ip),\n    }\n}\n\n/// Checks of the seed, without the HTTP handler.\n///\n/// Every test starts with the same cluster:\n///\n/// | Node   | Role               | Mesh IP   | Key          |\n/// |--------|--------------------|-----------|--------------|\n/// | node-1 | the seed           | 10.42.0.1 | `KEY_NODE_1` |\n/// | node-2 | a peer of the seed | 10.42.0.2 | `KEY_NODE_2` |\n///\n/// `node-3` is a new node that joins.\nmod check_join {\n    use super::*;\n\n    fn own() -\u003e MeshPeer {\n        peer(\"node-1\", KEY_NODE_1, [10, 42, 0, 1])\n    }\n\n    fn peers() -\u003e Vec\u003cMeshPeer\u003e {\n        vec![peer(\"node-2\", KEY_NODE_2, [10, 42, 0, 2])]\n    }\n\n    fn check(request: \u0026JoinRequest) -\u003e Result\u003cVec\u003cMeshPeer\u003e, JoinRefusal\u003e {\n        check_join(request, \u0026cluster(), \u0026own(), \u0026peers())\n    }\n\n    #[test]\n    fn free_mesh_ip_is_accepted_with_the_seed_and_its_peers_as_members() {\n        let members = check(\u0026request(\"node-3\", KEY_NODE_3, [10, 42, 0, 3])).unwrap();\n        assert_eq!(members, vec![own(), peers()[0].clone()]);\n    }\n\n    #[test]\n    fn mesh_ip_of_the_seed_or_a_peer_is_a_conflict() {\n        for taken in [[10, 42, 0, 1], [10, 42, 0, 2]] {\n            assert_eq!(\n                check(\u0026request(\"node-3\", KEY_NODE_3, taken)),\n                Err(JoinRefusal::MeshIpInUse),\n                \"{taken:?}\"\n            );\n        }\n    }\n\n    #[test]\n    fn retried_join_of_the_same_node_is_accepted() {\n        // node-3 joined, and it is a peer of the seed now. Its response was lost, so it asks again.\n        let node_3 = peer(\"node-3\", KEY_NODE_3, [10, 42, 0, 3]);\n        let mut peers = peers();\n        peers.push(node_3.clone());\n\n        let request = request(\"node-3\", KEY_NODE_3, [10, 42, 0, 3]);\n        let members = check_join(\u0026request, \u0026cluster(), \u0026own(), \u0026peers).unwrap();\n        assert!(!members.contains(\u0026node_3), \"node-3 is not its own member\");\n    }\n\n    #[test]\n    fn restarted_node_gets_its_old_mesh_ip_back() {\n        // node-2 restarted with a new key and proposes the IP of its old generation.\n        let request = request(\"node-2\", KEY_NODE_2_RESTARTED, [10, 42, 0, 2]);\n        assert_eq!(check(\u0026request), Ok(vec![own()]));\n    }\n\n    #[test]\n    fn node_with_the_id_of_the_seed_cannot_take_its_mesh_ip() {\n        let request = request(\"node-1\", KEY_NODE_3, [10, 42, 0, 1]);\n        assert_eq!(check(\u0026request), Err(JoinRefusal::MeshIpInUse));\n    }\n\n    #[test]\n    fn malformed_requests_are_refused() {\n        let bad = |r: JoinRequest| matches!(check(\u0026r), Err(JoinRefusal::BadRequest(_)));\n\n        assert!(bad(request(\"\", KEY_NODE_3, [10, 42, 0, 3])));\n        assert!(bad(request(\"node-3\", KEY_NODE_3, [192, 0, 2, 1])));\n        assert!(bad(request(\"node-3\", KEY_NODE_3, [10, 42, 0, 0])));\n    }\n\n    #[test]\n    fn other_cluster_config_is_refused() {\n        let mut other = cluster();\n        other.gossip_interval *= 2;\n        let mut request = request(\"node-3\", KEY_NODE_3, [10, 42, 0, 3]);\n        request.config_fingerprint = other.fingerprint();\n        assert_eq!(check(\u0026request), Err(JoinRefusal::ConfigMismatch));\n    }\n\n    #[test]\n    fn mesh_ip_outside_the_configured_subnet_is_refused() {\n        let small = ClusterConfig {\n            mesh_subnet: \"10.42.0.0/24\".parse().unwrap(),\n            ..cluster()\n        };\n        let mut request = request(\"node-3\", KEY_NODE_3, [10, 42, 1, 3]);\n        request.config_fingerprint = small.fingerprint();\n        assert!(matches!(\n            check_join(\u0026request, \u0026small, \u0026own(), \u0026peers()),\n            Err(JoinRefusal::BadRequest(_))\n        ));\n    }\n}\n\n#[test]\nfn messages_round_trip_as_json() {\n    let request = request(\"node-2\", KEY_NODE_2, [10, 42, 0, 2]);\n    let json = serde_json::to_string(\u0026request).unwrap();\n    assert_eq!(serde_json::from_str::\u003cJoinRequest\u003e(\u0026json).unwrap(), request);\n\n    let response = JoinResponse {\n        members: vec![peer(\"node-1\", KEY_NODE_1, [10, 42, 0, 1])],\n        gossip_seed: \"192.0.2.1:7280\".parse().unwrap(),\n    };\n    let json = serde_json::to_string(\u0026response).unwrap();\n    assert_eq!(\n        serde_json::from_str::\u003cJoinResponse\u003e(\u0026json).unwrap(),\n        response\n    );\n}\n\n#[test]\nfn request_with_a_bad_key_does_not_parse() {\n    let json = serde_json::to_string(\u0026request(\"node-2\", KEY_NODE_2, [10, 42, 0, 2])).unwrap();\n    let bad = json.replace(KEY_NODE_2, \"not a key\");\n    assert_ne!(bad, json);\n    assert!(serde_json::from_str::\u003cJoinRequest\u003e(\u0026bad).is_err());\n}\n\n#[test]\nfn jitter_adds_up_to_the_same_delay() {\n    let delay = Duration::from_secs(1);\n    for _ in 0..1000 {\n        let jittered = with_jitter(delay);\n        assert!(jittered \u003e= delay \u0026\u0026 jittered \u003c delay * 2, \"{jittered:?}\");\n    }\n}\n\n/// The seed's side of the join.\n///\n/// Every test starts with the same cluster:\n///\n/// | Node   | Role               | Mesh IP   | Key          |\n/// |--------|--------------------|-----------|--------------|\n/// | node-1 | the seed           | 10.42.0.1 | `KEY_NODE_1` |\n/// | node-2 | a peer of the seed | 10.42.0.2 | `KEY_NODE_2` |\n///\n/// `node-3` and `node-4` are new nodes that join.\nmod handle_join {\n    use super::*;\n\n    /// The join server of node-1, and the two ends of the channels\n    /// that `mesh::sync_peers` has in the agent.\n    struct Seed {\n        server: Arc\u003cJoinServer\u003e,\n        new_peers: mpsc::UnboundedReceiver\u003cMeshPeer\u003e,\n        peers: watch::Sender\u003cVec\u003cMeshPeer\u003e\u003e,\n    }\n\n    fn seed() -\u003e Seed {\n        let mut config =\n            Config::parse(\"[node]\\nid = \\\"node-1\\\"\\npublic_ip = \\\"192.0.2.1\\\"\\n\").unwrap();\n        config.cluster = cluster();\n\n        let (new_peers_tx, new_peers) = mpsc::unbounded_channel();\n        let (peers, peers_rx) = watch::channel(vec![peer(\"node-2\", KEY_NODE_2, [10, 42, 0, 2])]);\n        let server = Arc::new(JoinServer::new(\n            config,\n            peer(\"node-1\", KEY_NODE_1, [10, 42, 0, 1]),\n            \"10.42.0.1:7280\".parse().unwrap(),\n            new_peers_tx,\n            peers_rx,\n        ));\n        Seed {\n            server,\n            new_peers,\n            peers,\n        }\n    }\n\n    /// Calls the handler, and returns the response or the status of the refusal.\n    async fn call(seed: \u0026Seed, request: JoinRequest) -\u003e Result\u003cJoinResponse, StatusCode\u003e {\n        handle_join(State(seed.server.clone()), Json(request))\n            .await\n            .map(|Json(response)| response)\n            .map_err(|(status, _)| status)\n    }\n\n    fn mesh_ips(response: \u0026JoinResponse) -\u003e Vec\u003cIpv4Addr\u003e {\n        let mut ips: Vec\u003cIpv4Addr\u003e = response.members.iter().map(|m| m.mesh_ip).collect();\n        ips.sort();\n        ips\n    }\n\n    #[tokio::test]\n    async fn accepted_join_returns_the_members_and_sends_the_new_peer() {\n        let mut seed = seed();\n        let request = request(\"node-3\", KEY_NODE_3, [10, 42, 0, 3]);\n\n        let response = call(\u0026seed, request.clone()).await.unwrap();\n\n        assert_eq!(\n            mesh_ips(\u0026response),\n            vec![Ipv4Addr::new(10, 42, 0, 1), Ipv4Addr::new(10, 42, 0, 2)]\n        );\n        assert_eq!(response.gossip_seed, \"10.42.0.1:7280\".parse().unwrap());\n        assert_eq!(seed.new_peers.try_recv(), Ok(request.peer));\n    }\n\n    #[tokio::test]\n    async fn other_config_is_a_bad_request() {\n        let mut seed = seed();\n        let mut other = cluster();\n        other.mtu -= 1;\n        let mut request = request(\"node-3\", KEY_NODE_3, [10, 42, 0, 3]);\n        request.config_fingerprint = other.fingerprint();\n\n        assert_eq!(call(\u0026seed, request).await, Err(StatusCode::BAD_REQUEST));\n        assert!(seed.new_peers.try_recv().is_err());\n    }\n\n    #[tokio::test]\n    async fn malformed_request_is_a_bad_request() {\n        let mut seed = seed();\n        // Outside the mesh subnet.\n        let request = request(\"node-3\", KEY_NODE_3, [192, 0, 2, 3]);\n\n        assert_eq!(call(\u0026seed, request).await, Err(StatusCode::BAD_REQUEST));\n        assert!(seed.new_peers.try_recv().is_err());\n    }\n\n    #[tokio::test]\n    async fn mesh_ip_of_the_seed_or_a_peer_is_a_conflict() {\n        let mut seed = seed();\n        for taken in [[10, 42, 0, 1], [10, 42, 0, 2]] {\n            let request = request(\"node-3\", KEY_NODE_3, taken);\n            assert_eq!(\n                call(\u0026seed, request).await,\n                Err(StatusCode::CONFLICT),\n                \"{taken:?}\"\n            );\n        }\n        assert!(seed.new_peers.try_recv().is_err());\n    }\n\n    #[tokio::test]\n    async fn node_that_just_joined_counts_after_the_peer_sync() {\n        let mut seed = seed();\n        // node-3 joins.\n        call(\u0026seed, request(\"node-3\", KEY_NODE_3, [10, 42, 0, 3]))\n            .await\n            .unwrap();\n        // The peer sync adds node-3 as a pending peer,\n        // and sends all peers back to the join server.\n        let node_3 = seed.new_peers.try_recv().unwrap();\n        seed.peers.send_modify(|peers| peers.push(node_3));\n\n        // node-4 proposes the IP of node-3.\n        let taken = request(\"node-4\", KEY_NODE_4, [10, 42, 0, 3]);\n        assert_eq!(call(\u0026seed, taken).await, Err(StatusCode::CONFLICT));\n\n        // node-4 proposes a free IP and gets node-3 as a member.\n        let free = request(\"node-4\", KEY_NODE_4, [10, 42, 0, 4]);\n        let response = call(\u0026seed, free).await.unwrap();\n        assert_eq!(\n            mesh_ips(\u0026response),\n            vec![\n                Ipv4Addr::new(10, 42, 0, 1),\n                Ipv4Addr::new(10, 42, 0, 2),\n                Ipv4Addr::new(10, 42, 0, 3)\n            ]\n        );\n    }\n\n    #[tokio::test]\n    async fn restarted_node_gets_its_old_mesh_ip_back() {\n        let seed = seed();\n        // node-2 restarted with a new key and proposes the IP of its old generation.\n        let request = request(\"node-2\", KEY_NODE_2_RESTARTED, [10, 42, 0, 2]);\n\n        let response = call(\u0026seed, request).await.unwrap();\n        assert!(\n            response.members.iter().all(|m| m.node_id != \"node-2\"),\n            \"the old generation of node-2 is not a member\"\n        );\n    }\n\n    #[tokio::test]\n    async fn stopped_peer_sync_is_an_error() {\n        let seed = seed();\n        drop(seed.new_peers);\n        let server = seed.server.clone();\n        let request = request(\"node-3\", KEY_NODE_3, [10, 42, 0, 3]);\n\n        let result = handle_join(State(server), Json(request)).await;\n        assert!(matches!(result, Err((StatusCode::SERVICE_UNAVAILABLE, _))));\n    }\n}\n","traces":[],"covered":0,"coverable":0},{"path":["/","home","runner","work","yaco","yaco","crates","yaco-agent","src","keys","mod.rs"],"content":"//! Keys derived from the join token.\n//!\n//! The join token is the cluster secret.\n//! Every node derives the same keys from it,\n//! so the keys are never sent over the network.\n\nmod tests;\n\nuse defguard_wireguard_rs::key::Key;\nuse hkdf::Hkdf;\nuse sha2::Sha256;\n\n/// A shorter token is too easy to guess.\npub const MIN_TOKEN_LEN: usize = 16;\n\n/// All keys that come from the cluster secret.\npub struct ClusterKeys {\n    /// Private key of the bootstrap interface in the server role (every member).\n    pub boot_server: Key,\n    /// Private key of the bootstrap interface in the client role (a joining node).\n    pub boot_client: Key,\n    /// Pre-shared key for every peer of the mesh interface.\n    pub mesh_psk: Key,\n}\n\nimpl ClusterKeys {\n    pub fn derive(token: \u0026str) -\u003e anyhow::Result\u003cClusterKeys\u003e {\n        anyhow::ensure!(\n            token.len() \u003e= MIN_TOKEN_LEN,\n            \"the join token must have at least {MIN_TOKEN_LEN} characters\"\n        );\n        Ok(ClusterKeys {\n            boot_server: derive_key(token, \"yaco-bootstrap-server-v1\"),\n            boot_client: derive_key(token, \"yaco-bootstrap-client-v1\"),\n            mesh_psk: derive_key(token, \"yaco-mesh-psk-v1\"),\n        })\n    }\n}\n\n/// HKDF-SHA256 with no salt.\n/// The result is a WireGuard private key or pre-shared key.\n/// WireGuard clamps private keys itself, so any 32 bytes are valid.\nfn derive_key(token: \u0026str, info: \u0026str) -\u003e Key {\n    let mut okm = [0u8; 32];\n    Hkdf::\u003cSha256\u003e::new(None, token.as_bytes())\n        .expand(info.as_bytes(), \u0026mut okm)\n        .expect(\"32 bytes is a valid HKDF-SHA256 output length\");\n    Key::new(okm)\n}\n","traces":[{"line":27,"address":[13318784],"length":1,"stats":{"Line":1}},{"line":28,"address":[13318855,13319191],"length":1,"stats":{"Line":1}},{"line":32,"address":[13318991],"length":1,"stats":{"Line":2}},{"line":33,"address":[13318888],"length":1,"stats":{"Line":1}},{"line":34,"address":[15033148],"length":1,"stats":{"Line":2}},{"line":35,"address":[13318960],"length":1,"stats":{"Line":2}},{"line":43,"address":[13329843,13329849,13329472],"length":1,"stats":{"Line":2}},{"line":44,"address":[13329557],"length":1,"stats":{"Line":2}},{"line":45,"address":[13329570],"length":1,"stats":{"Line":2}},{"line":46,"address":[13329677,13329609],"length":1,"stats":{"Line":4}},{"line":48,"address":[13329764],"length":1,"stats":{"Line":2}}],"covered":11,"coverable":11},{"path":["/","home","runner","work","yaco","yaco","crates","yaco-agent","src","keys","tests.rs"],"content":"#![cfg(test)]\n\nuse super::*;\n\nconst TOKEN: \u0026str = \"0123456789abcdef\";\n\n#[test]\nfn keys_are_stable() {\n    // If these values change, nodes of different versions cannot join each other.\n    // Reference values from Python: hmac/hashlib, RFC 5869 with no salt.\n    let keys = ClusterKeys::derive(TOKEN).unwrap();\n    assert_eq!(\n        keys.boot_server.to_string(),\n        \"4lAI2XxYeisYZOiOjeG772iG6nZGMTzyCDroB+oPcz8=\"\n    );\n    assert_eq!(\n        keys.boot_client.to_string(),\n        \"wwg09tnkbQ61Fu04U4l1Z9KE+3DtmgnyXfxFExUJgS4=\"\n    );\n    assert_eq!(\n        keys.mesh_psk.to_string(),\n        \"0QXXdTWKC0so+1oKPD2JA8yraR1aFPZlRGYJ8i/3wKI=\"\n    );\n}\n\n#[test]\nfn different_tokens_give_different_keys() {\n    let a = ClusterKeys::derive(TOKEN).unwrap();\n    let b = ClusterKeys::derive(\"0123456789abcdeX\").unwrap();\n    assert_ne!(a.boot_server.to_string(), b.boot_server.to_string());\n    assert_ne!(a.boot_client.to_string(), b.boot_client.to_string());\n    assert_ne!(a.mesh_psk.to_string(), b.mesh_psk.to_string());\n}\n\n#[test]\nfn short_token_is_an_error() {\n    assert!(ClusterKeys::derive(\"short\").is_err());\n}\n","traces":[],"covered":0,"coverable":0},{"path":["/","home","runner","work","yaco","yaco","crates","yaco-agent","src","lib.rs"],"content":"pub mod api;\npub mod config;\npub mod gossip;\npub mod join;\npub mod keys;\npub mod mesh;\npub mod view;\n\n#[cfg(test)]\nmod test_util;\n","traces":[],"covered":0,"coverable":0},{"path":["/","home","runner","work","yaco","yaco","crates","yaco-agent","src","main.rs"],"content":"use std::io::IsTerminal;\nuse std::net::{IpAddr, SocketAddr};\nuse std::path::PathBuf;\n\nuse anyhow::Context;\nuse clap::Parser;\nuse defguard_wireguard_rs::key::Key;\nuse tokio::net::TcpListener;\nuse tokio::sync::{broadcast, mpsc, watch};\nuse tracing_subscriber::EnvFilter;\nuse yaco_agent::api::{self, ApiState};\nuse yaco_agent::config::Config;\nuse yaco_agent::gossip;\nuse yaco_agent::join::{self, Bootstrap, JoinServer};\nuse yaco_agent::keys::ClusterKeys;\nuse yaco_agent::mesh::{self, Mesh, MeshPeer};\nuse yaco_agent::view::{self, ClusterView};\n\n#[derive(Parser)]\n#[command(version, about = \"YACO node agent\")]\nstruct Args {\n    /// Path of the config file. See `yaco.example.toml`.\n    #[arg(long, env = \"YACO_CONFIG\", default_value = \"/etc/yaco/yaco.toml\")]\n    config: PathBuf,\n\n    /// The cluster secret. Every node of the cluster has the same token.\n    /// Prefer the environment variable: command line arguments are visible to other users.\n    #[arg(long, env = \"YACO_TOKEN\", hide_env_values = true)]\n    token: String,\n}\n\n#[tokio::main]\nasync fn main() -\u003e anyhow::Result\u003c()\u003e {\n    tracing_subscriber::fmt()\n        // No color codes in files and in the journal.\n        .with_ansi(std::io::stdout().is_terminal())\n        .with_env_filter(\n            EnvFilter::try_from_default_env().unwrap_or_else(|_| EnvFilter::new(\"info\")),\n        )\n        .init();\n\n    let args = Args::parse();\n    let config = Config::load(\u0026args.config)?;\n    let keys = ClusterKeys::derive(\u0026args.token)?;\n\n    // A new key on every start. Storing it on disk is a later step.\n    let private_key = Key::generate();\n    let public_key = private_key.public_key();\n    let boot = Bootstrap::create(\u0026config)?;\n    // Pending peers to `mesh::sync_peers`, and all peers of this node back to the join server.\n    let (new_peers_tx, new_peers_rx) = mpsc::unbounded_channel();\n    let (peers_tx, peers_rx) = watch::channel(Vec::new());\n    // The cluster view (`view::run`) to its readers: the latest view, and every change.\n    let (view_tx, view_rx) = watch::channel(ClusterView::empty(\u0026config.node.id));\n    let (events_tx, _) = broadcast::channel(view::EVENT_BUFFER);\n\n    let (own_facts, members, gossip_seeds) = if config.node.seeds.is_empty() {\n        tracing::info!(\"no seeds, starting a new cluster\");\n        (\n            MeshPeer::own(\u0026config, \u0026public_key, 0),\n            Vec::new(),\n            Vec::new(),\n        )\n    } else {\n        let (own_facts, response) = join::join(\u0026boot, \u0026keys, \u0026config, \u0026public_key).await?;\n        // The gossip seed is the mesh address of the seed.\n        (own_facts, response.members, vec![response.gossip_seed])\n    };\n\n    let mut mesh = Mesh::create(\u0026config, \u0026private_key, \u0026keys.mesh_psk, own_facts.mesh_ip)?;\n\n    // Send all discovered peers from joining a cluster to be configured by `mesh::sync_peers`\n    for peer in members {\n        new_peers_tx.send(peer)?;\n    }\n\n    let gossip_addr = SocketAddr::new(IpAddr::V4(own_facts.mesh_ip), config.cluster.gossip_port);\n    let chitchat_config =\n        gossip::config(\u0026config.node.id, gossip_addr, \u0026gossip_seeds, \u0026config.cluster);\n    let handle = gossip::start(chitchat_config, own_facts.to_facts()).await?;\n\n    let api_addr = SocketAddr::new(IpAddr::V4(own_facts.mesh_ip), config.cluster.api_port);\n    let api_listener = TcpListener::bind(api_addr)\n        .await\n        .with_context(|| format!(\"cannot bind the node API to {api_addr}\"))?;\n\n    // From now on, this node is a seed for other nodes.\n    boot.set_server(\u0026keys)?;\n    let join_server = JoinServer::new(\n        config.clone(),\n        own_facts.clone(),\n        gossip_addr,\n        new_peers_tx,\n        peers_rx,\n    );\n\n    tracing::info!(\n        node_id = %config.node.id,\n        public_ip = %config.node.public_ip,\n        gossip = %gossip_addr,\n        api = %api_addr,\n        mesh_ip = %own_facts.mesh_ip,\n        wg_endpoint = %own_facts.endpoint,\n        boot_port = config.node.boot_port,\n        config_fingerprint = %config.cluster.fingerprint(),\n        \"agent started\"\n    );\n\n    let result = tokio::select! {\n        _ = async {\n            tokio::join!(\n                view::run(\u0026handle, view_tx, events_tx.clone(), config.cluster.peer_resync_interval),\n                view::log_membership(view_rx.clone()),\n                mesh::sync_peers(view_rx.clone(), \u0026mut mesh, new_peers_rx, peers_tx, config.cluster.peer_resync_interval),\n            )\n        } =\u003e {\n            tracing::error!(\"chitchat stopped\");\n            handle.shutdown().await\n        }\n        result = join::serve(join_server) =\u003e {\n            tracing::error!(\"join endpoint stopped: {result:?}\");\n            handle.shutdown().await\n        }\n        result = api::serve(api_listener, ApiState { view: view_rx.clone(), events: events_tx.clone() }) =\u003e {\n            tracing::error!(\"node API stopped: {result:?}\");\n            handle.shutdown().await\n        }\n        _ = tokio::signal::ctrl_c() =\u003e {\n            tracing::info!(\"leaving the cluster\");\n            gossip::leave(handle, \u0026config.cluster).await\n        }\n    };\n\n    mesh.remove();\n    result\n}\n","traces":[{"line":33,"address":[13300399,13300393,13299936],"length":1,"stats":{"Line":0}},{"line":34,"address":[13275934],"length":1,"stats":{"Line":0}},{"line":36,"address":[13276330],"length":1,"stats":{"Line":0}},{"line":38,"address":[13270720,13270704,13276423],"length":1,"stats":{"Line":0}},{"line":42,"address":[13276530],"length":1,"stats":{"Line":0}},{"line":43,"address":[13276645,13280247,13276552],"length":1,"stats":{"Line":0}},{"line":44,"address":[13276946,13280229,13276856],"length":1,"stats":{"Line":0}},{"line":47,"address":[13277247],"length":1,"stats":{"Line":0}},{"line":48,"address":[13277273],"length":1,"stats":{"Line":0}},{"line":49,"address":[13277309,13280194],"length":1,"stats":{"Line":0}},{"line":51,"address":[13277617,13277519],"length":1,"stats":{"Line":0}},{"line":52,"address":[13277645,13277728],"length":1,"stats":{"Line":0}},{"line":54,"address":[13277802,13277889],"length":1,"stats":{"Line":0}},{"line":55,"address":[13278077,13277991],"length":1,"stats":{"Line":0}},{"line":57,"address":[13278167,13279944,13281400],"length":1,"stats":{"Line":0}},{"line":58,"address":[13278255,13278379,13278
