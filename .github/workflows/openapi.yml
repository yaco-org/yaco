name: OpenAPI spec

on:
  push:
    branches: [main]
    paths:
      - "crates/yaco-api/**"
      - ".github/workflows/openapi.yml"
  pull_request:
    paths:
      - "crates/yaco-api/**"
      - ".github/workflows/openapi.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.98"
      - uses: Swatinem/rust-cache@v2
      - name: Render the spec
        run: |
          mkdir api
          cargo run --locked -p yaco-api --example openapi > api/openapi.json
          cp crates/yaco-api/pages/index.html api/
      - uses: actions/upload-artifact@v7
        with:
          name: api
          path: api

  # Commits the page to /api on the gh-pages branch.
  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: render
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: gh-pages
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: api
          path: api
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: api
          destination_dir: api
